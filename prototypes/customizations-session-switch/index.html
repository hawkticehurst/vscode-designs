<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Customizations — This session · Library · Browse</title>
<link rel="stylesheet" href="../../systems/vscode/system.css" />
<link rel="stylesheet" href="panel-kit.css" />
<link rel="stylesheet" href="session.css" />
<link rel="stylesheet" href="library.css" />
<script type="module" src="../../systems/vscode/system.js"></script>
<script src="customizations.js"></script>
<script src="panel-config.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #121314; overflow: hidden; }
  #wb {
    /* Toast insets, as the Agents window sets them (src/vs/sessions/browser/media/workbench.css), widened to 16px so toasts clear the floating panel edge. */
    --modern-ui-notifications-inline-inset: var(--vscode-spacing-size160);
    --modern-ui-notifications-block-end-inset: var(--vscode-spacing-size160); position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column;
        background: var(--vscode-agents-background); color: var(--vscode-foreground); font-size: var(--vscode-agents-fontSize-body1); }
  .tb button { font: inherit; color: inherit; }
  /* border-box only on prototype-owned elements: VS Code widgets rely on content-box */
  :is(.tb) :is(.cc, .avatar) { box-sizing: border-box; }
  .grow { flex: 1; }

  .tb { height: 38px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; }
  .tb-center { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; }
  /* Session pill, after src/vs/sessions/contrib/sessions/browser/media/sessionsTitleBarWidget.css. */
  .cc { width: 31vw; max-width: 600px; height: 22px; display: flex; align-items: center; border-radius: var(--vscode-cornerRadius-medium); cursor: pointer;
        border: 1px solid var(--vscode-commandCenter-border); background: transparent; color: var(--vscode-commandCenter-foreground); }
  .cc:hover { background: var(--vscode-commandCenter-activeBackground); }
  .cc-pill { display: flex; align-items: center; gap: 6px; padding: 0 8px; min-width: 0; opacity: 0.6; }
  .cc-pill .codicon { font-size: var(--vscode-codiconFontSize-compact, 14px) !important; }
  .cc-label { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .avatar { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 600; flex: none;
            background: var(--vscode-chat-avatarBackground); color: var(--vscode-chat-avatarForeground); border: 1px solid var(--vscode-agentsCard-border); }
  .avatar-photo { padding: 0; overflow: hidden; cursor: pointer; }
  .avatar-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Agents window parts row: the sessions part and the docked editor part (src/vs/sessions layout), 2px apart. */
  .parts { flex: 1; min-height: 0; display: flex; margin: 0 4px 4px; }
  .side-panel { position: relative; flex: none; height: 100%; margin-left: 2px; }
  .side-panel[hidden] { display: none; }
  /* The workbench grid's sash between the sessions part and the docked editor part, centered on the 2px gap. */
  #panel-sash { left: calc(-1px - var(--vscode-sash-size) / 2); }
  .page { flex: 1; min-width: 0; min-height: 0; margin: 0; border-radius: var(--vscode-cornerRadius-large); overflow-y: auto;
          background: var(--vscode-agentsPanel-background); color: var(--vscode-agentsPanel-foreground); border: 1px solid var(--vscode-agentsPanel-border); }
  /* Home: the Agents window's new-session view. Welcome message centered above the new-session composer, both centered
     in the sessions part (src/vs/sessions/contrib/chat/browser/media/chatWidget.css; these container and welcome rules
     aren't in the design system's captures). */
  .page > vsc-session-view { height: 100%; }
  .page .session-view, .page .session-view-content, .page .chat-view-new, .page .sessions-chat-widget { height: 100%; }
  .page .sessions-chat-widget { display: flex; flex-direction: column; width: 100%; position: relative; }
  .page .new-chat-widget-container { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%;
    box-sizing: border-box; overflow: hidden; padding: var(--vscode-spacing-size160) var(--vscode-spacing-size160) var(--vscode-spacing-size200); position: relative; }
  .page .new-chat-widget-container > vsc-chat-input { width: 100%; max-width: 800px; }
  .new-session-welcome-message { align-self: center; align-items: center; display: flex; gap: var(--vscode-spacing-size40); justify-content: center;
    margin-bottom: var(--vscode-spacing-size160); position: relative; text-align: center; }
  .new-session-welcome-message-title { color: var(--vscode-foreground); font-size: var(--vscode-fontSize-heading1); font-weight: 400; line-height: 1.4; margin: 0; }

  /* ---- Phone (≤ 640px) ---- */
  @media (max-width: 640px) {
    /* Title bar: sidebar toggle, session pill (fills the space) and avatar. Navigation, run and layout actions are desktop-only. */
    .tb { gap: 6px; padding: 0 8px; }
    .tb-center { position: static; transform: none; flex: 1; min-width: 0; }
    .tb-center + .grow { display: none; }
    .tb-nav, .tb-run, .tb-layout { display: none; }
    .cc { width: auto; flex: 1; min-width: 0; }
    .side-panel { display: none; }
  }

  /* ===== This variant ===== */
  .v6-head { padding-left: var(--vscode-spacing-size80); }
  .v6-head vsc-view-tabs { flex: 1; min-width: 0; }
  .cp-view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .cp-chips { flex: none; display: flex; gap: var(--vscode-spacing-size40); overflow-x: auto; scrollbar-width: none;
    padding: 0 var(--vscode-spacing-size120) var(--vscode-spacing-size80); }
  .cp-chips::-webkit-scrollbar { display: none; }
  .cp-chip { flex: none; display: inline-flex; align-items: center; gap: var(--vscode-spacing-size60); height: 24px; padding: 0 var(--vscode-spacing-size100);
    box-sizing: border-box; border-radius: var(--vscode-cornerRadius-circle); border: 1px solid var(--vscode-agentsCard-border); background: transparent;
    color: var(--vscode-foreground); font-size: var(--vscode-fontSize-label1); cursor: pointer; white-space: nowrap; }
  .cp-chip:hover { background: var(--vscode-list-hoverBackground); }
  .cp-chip:focus-visible { outline: 1px solid var(--vscode-focusBorder); outline-offset: -1px; }
  .cp-chip .n { color: var(--vscode-descriptionForeground); }
  .cp-chip[aria-checked="true"] { background: var(--vscode-inputOption-activeBackground); border-color: var(--vscode-inputOption-activeBorder); }
  .lib-intro { flex: none; margin: 0 var(--vscode-spacing-size120) var(--vscode-spacing-size80); color: var(--vscode-descriptionForeground); font-size: var(--vscode-fontSize-label1); line-height: 1.45; }
  #lib-flow[data-single] .cp-sec-head { display: none; }
  #lib-flow { padding-bottom: var(--vscode-spacing-size120); }
  #v-browse .cust-page { flex: 1; min-height: 0; }

</style>
</head>
<body>
<vsc-workbench id="wb" theme="dark-2026" window="agents" class="nostatusbar">
  <header class="tb">
    <vsc-toolbar label="Window"><vsc-action icon="layout-sidebar-left" label="Hide Sessions Sidebar" id="toggle-sidebar" checked></vsc-action></vsc-toolbar>
    <div class="tb-center">
      <vsc-toolbar class="tb-nav" label="Session Navigation"><vsc-action icon="arrow-left" label="Go Back" id="nav-back"></vsc-action><vsc-action icon="arrow-right" label="Go Forward" id="nav-fwd" disabled></vsc-action></vsc-toolbar>
      <div class="cc" role="button" tabindex="0" aria-label="Show Sessions: No workspace"><div class="cc-pill"><span class="codicon codicon-comment-discussion" aria-hidden="true"></span><span class="cc-label">No workspace</span></div></div>
      <vsc-toolbar class="tb-run" label="Session Actions"><vsc-action icon="play" label="Run" disabled></vsc-action><vsc-action icon="vscode-insiders" label="Open in VS Code - Insiders"></vsc-action></vsc-toolbar>
    </div>
    <div class="grow"></div>
    <vsc-toolbar class="tb-layout" label="Layout">
      <vsc-action icon="layout-panel-off" label="Show Panel (⌘J)"></vsc-action>
      <vsc-action icon="layout-sidebar-right" label="Toggle Side Panel (⌥⌘B)" id="toggle-panel" checked></vsc-action>
      <vsc-action icon="radio-tower" label="Remote Access"></vsc-action>
    </vsc-toolbar>
    <button class="avatar avatar-photo" title="hawkticehurst" aria-label="Accounts: hawkticehurst"><img src="assets/profile.jpg" alt="" /></button>
  </header>
  <div class="parts">
  <aside class="ssb" id="sessions-sidebar" aria-label="Sessions">
    <div class="ssb-nav" role="list" aria-label="Navigation">
      <button class="ssb-short ssb-new" role="listitem" data-nav="new"><span class="codicon codicon-plus ssb-icon" aria-hidden="true"></span><span class="ssb-label">New Session</span><vsc-keybinding keys="⌘+N"></vsc-keybinding></button>
      <button class="ssb-short" role="listitem" data-nav="automations"><span class="codicon codicon-calendar ssb-icon" aria-hidden="true"></span><span class="ssb-label">Automations</span></button>
      <button class="ssb-short" role="listitem" data-nav="customizations" id="nav-customizations"><span class="codicon codicon-extensions ssb-icon" aria-hidden="true"></span><span class="ssb-label">Customizations</span></button>
    </div>
    <div class="ssb-header">
      <span class="ssb-header-label">Sessions</span>
      <vsc-toolbar label="Sessions Actions"><vsc-action icon="filter" label="Filter Sessions"></vsc-action><vsc-action icon="search" label="Search Sessions"></vsc-action><vsc-action icon="ellipsis" label="More Actions..."></vsc-action></vsc-toolbar>
    </div>
    <div class="ssb-list" role="tree" aria-label="Sessions">
      <div class="ssb-section" role="treeitem"><span class="codicon codicon-pinned ssb-icon" aria-hidden="true"></span><span class="ssb-label">Pinned</span></div>
      <div class="ssb-section" role="treeitem"><span class="codicon codicon-comment-discussion ssb-icon" aria-hidden="true"></span><span class="ssb-label">Chats</span></div>
      <button class="ssb-chat unread" role="treeitem"><span class="ssb-status"><span class="ssb-dot" aria-label="Unread"></span></span><span class="ssb-title">Customizations sidebar prototype</span></button>
      <button class="ssb-chat" role="treeitem"><span class="ssb-status"><span class="ssb-spinner" aria-label="In progress"></span></span><span class="ssb-title">Settings prototype</span></button>
      <div class="ssb-section" role="treeitem"><span class="codicon codicon-folder ssb-icon" aria-hidden="true"></span><span class="ssb-label">vscode</span></div>
      <button class="ssb-chat" role="treeitem"><span class="ssb-status"><span class="ssb-dot idle" aria-hidden="true"></span></span><span class="ssb-title">Fix tree group collapse in customization list</span></button>
      <button class="ssb-chat" role="treeitem"><span class="ssb-status"><span class="ssb-dot idle" aria-hidden="true"></span></span><span class="ssb-title">Settings IA: agents-first ordering</span></button>
      <div class="ssb-section" role="treeitem"><span class="codicon codicon-folder ssb-icon" aria-hidden="true"></span><span class="ssb-label">vscode [devbox-1]</span></div>
      <button class="ssb-chat" role="treeitem"><span class="ssb-status"><span class="ssb-dot idle" aria-hidden="true"></span></span><span class="ssb-title">Triage customization migration issues</span></button>
      <div class="ssb-section" role="treeitem"><span class="codicon codicon-folder ssb-icon" aria-hidden="true"></span><span class="ssb-label">adt</span></div>
      <button class="ssb-chat" role="treeitem"><span class="ssb-status"><span class="ssb-dot idle" aria-hidden="true"></span></span><span class="ssb-title">Export design system skill</span></button>
    </div>
  </aside>
  <main class="page" id="page">
    <vsc-session-view variant="new">
      <div class="new-session-welcome-message"><h2 class="new-session-welcome-message-title" id="greet">Good morning, Hawk</h2></div>
      <vsc-chat-input id="composer" variant="new-session" placeholder="What should agents work on?" workspace="vscode" isolation="worktree"></vsc-chat-input>
    </vsc-session-view>
  </main>
  <aside class="side-panel" id="side-panel" aria-label="Side Panel">
    <div class="monaco-sash mac vertical" id="panel-sash" role="separator" aria-orientation="vertical" aria-label="Resize Side Panel"></div>
    <vsc-agents-editor-part id="editor-part" tabs="Changes,Files,Customizations" active="Customizations">
    <section class="cpanel" id="cpanel" aria-label="Customizations">
      <header class="cp-header v6-head">
        <vsc-view-tabs id="views" label="Customizations" active="session"><vsc-view-tab value="session">This session</vsc-view-tab><vsc-view-tab value="library">Library</vsc-view-tab><vsc-view-tab value="browse">Browse</vsc-view-tab></vsc-view-tabs>
        <vsc-toolbar label="Customizations Actions"><vsc-action icon="ellipsis" label="More Actions..."></vsc-action></vsc-toolbar>
      </header>
      <div class="cp-view" id="v-session"></div>
      <div class="cp-view" id="v-library" hidden>
        <p class="lib-intro">Everything you have, across workspaces and agents. Sessions use what applies to their workspace and agent.</p>
        <div class="cp-search"><vsc-input id="lib-q" placeholder="Search your library"></vsc-input></div>
        <div class="cp-chips" id="lib-chips" role="radiogroup" aria-label="Filter by type"></div>
        <div class="cp-scroll"><div class="ai-customization-management-editor cust-flow" id="lib-flow"></div><div class="cp-empty" id="lib-empty" hidden></div></div>
      </div>
      <div class="cp-view" id="v-browse" hidden></div>
    </section>
    </vsc-agents-editor-part>
  </aside>
  <script src="stage.js"></script>
  <script src="scope.js"></script>
  <script>
    // Runs while the page parses, before system.js upgrades the elements (they read their slotted children once).
    (function () {
      const C = window.PANEL_CONFIG, { items } = window.SCOPE, params = new URLSearchParams(location.search);
      document.getElementById("side-panel").style.width = C.width + "px";
      const composer = document.getElementById("composer");
      for (const k of ["workspace", "harness", "environment"]) { if (params.get(k)) C.scope[k] = params.get(k); composer.setAttribute(k, C.scope[k]); }
      if (params.get("sidebar") === "off") { C.sidebar = false; }
      document.getElementById("sessions-sidebar").hidden = !C.sidebar;
      const browse = window.CUST.hostPage(window.CUST.first.browse);
      browse.classList.add("no-title");
      document.getElementById("v-browse").append(browse);
    })();
  </script>
  <script>
    // The welcome phrase follows the time of day.
    (function () {
      const h = new Date().getHours();
      document.getElementById("greet").textContent = `Good ${h < 12 ? "morning" : h < 18 ? "afternoon" : "evening"}, Hawk`;
    })();
  </script>
  </div>
  <vsc-notification-toasts></vsc-notification-toasts>
</vsc-workbench>

<script type="module">
import { setPanel, setTab, filterList } from "./panel-shell.js";
import { mountSession } from "./session-view.js";
// Sessions sidebar: toggled from the title bar (its Customizations section is the entry to everything you have).
const sidebar = document.getElementById("sessions-sidebar"), sbToggle = document.getElementById("toggle-sidebar");
const setSidebar = (open) => {
  sidebar.hidden = !open;
  sbToggle.setAttribute("icon", open ? "layout-sidebar-left" : "layout-sidebar-left-off");
  sbToggle.setAttribute("label", open ? "Hide Sessions Sidebar" : "Show Sessions Sidebar");
  sbToggle.toggleAttribute("checked", open);
};
setSidebar(!sidebar.hidden);
sbToggle.addEventListener("click", () => setSidebar(sidebar.hidden));
const navCustomizations = document.getElementById("nav-customizations");
sidebar.querySelector(".ssb-nav").addEventListener("click", (e) => {
  const b = e.target.closest("[data-nav]");
  if (b && b.dataset.nav !== "customizations") import("./panel-shell.js").then((m) => m.toast(b.dataset.nav === "new" ? "You're already in a new session." : "Automations aren't part of this prototype."));
});

const C = window.PANEL_CONFIG, params = new URLSearchParams(location.search);
const { TYPES, SOURCES, WORKSPACES, items } = window.SCOPE, { esc } = window.CUST;
const $ = (s) => document.querySelector(s);

function setView(view) {
  $("#views").setAttribute("active", view);
  for (const v of ["session", "library", "browse"]) $("#v-" + v).hidden = v !== view;
  navCustomizations.classList.toggle("active", view !== "session");
}
$("#views").addEventListener("change", (e) => setView(e.detail.value));

mountSession($("#v-session"), { scope: C.scope, composer: $("#composer"), footer: false });

// Library: one section per type; inside, the type's tree grouped by source (yours, each workspace, plugins, built-in).
const flow = $("#lib-flow"), chips = $("#lib-chips");
const state = { filter: params.get("filter") || C.filter, q: "" };
const groupsFor = (t) => {
  const of = items.filter((it) => it.type === t.id);
  const parts = [["Yours", "account", of.filter((it) => it.source === "user")],
    ...Object.entries(WORKSPACES).map(([id, w]) => [w.label, "folder", of.filter((it) => it.source === "workspace" && it.workspace === id)]),
    ["From plugins", "plug", of.filter((it) => it.source === "plugin")], ["Built-in", "vscode-insiders", of.filter((it) => it.source === "builtin")]];
  return parts.filter(([, , rows]) => rows.length).map(([label, icon, rows], i) =>
    `<vsc-customization-group label="${esc(label)}" count="${rows.length}" icon="${icon}" actions=""${i === 0 ? " first" : ""}${rows.length > 6 ? " collapsed" : ""}></vsc-customization-group>` + rows.map((r) => r.html).join("")).join("");
};
chips.innerHTML = [{ id: "all", label: "All" }, ...TYPES.map((t) => ({ ...t, n: items.filter((it) => it.type === t.id).length })), { id: "tools", label: "Tools", n: 36 }, { id: "extensions", label: "Extensions", n: 11 }].map((c) =>
  `<button class="cp-chip" role="radio" data-filter="${c.id}" aria-checked="false">${esc(c.id === "mcp" ? "MCP" : c.label)}${c.n != null ? `<span class="n">${c.n}</span>` : ""}</button>`).join("");
flow.innerHTML = TYPES.map((t) => `<section class="cp-sec" data-cat="${t.id}"><div class="cp-sec-head" role="button" tabindex="0" aria-expanded="true">
  <span class="codicon codicon-chevron-down cp-twist" aria-hidden="true"></span><span class="codicon codicon-${t.icon} cp-sec-icon" aria-hidden="true"></span>
  <span class="cp-sec-label">${t.id === "mcp" ? "MCP servers" : t.label}</span><span class="cp-count">${items.filter((it) => it.type === t.id).length}</span><span class="grow"></span></div>
  <div class="cust-list-wrap"><vsc-customization-list kind="${t.kind}">${groupsFor(t)}</vsc-customization-list></div></section>`).join("");
// Tools and Extensions (Agents window–wide): the product lists, stacked like the others.
for (const [id, label, icon, n] of [["tools", "Tools", "ai-customization-tools", 36], ["extensions", "Extensions", "extensions-view-icon", 11]]) {
  const sec = document.createElement("section");
  sec.className = "cp-sec"; sec.dataset.cat = id;
  sec.innerHTML = `<div class="cp-sec-head" role="button" tabindex="0" aria-expanded="true"><span class="codicon codicon-chevron-down cp-twist" aria-hidden="true"></span><span class="codicon codicon-${icon} cp-sec-icon" aria-hidden="true"></span><span class="cp-sec-label">${label}</span><span class="cp-count">${n}</span><span class="grow"></span></div><div class="cust-list-wrap"></div>`;
  sec.querySelector(".cust-list-wrap").append(window.CUST.first[id]);
  flow.append(sec);
}
const sections = [...flow.querySelectorAll(".cp-sec")];
customElements.whenDefined("vsc-customization-list").then(() => requestAnimationFrame(() => { for (const l of flow.querySelectorAll("vsc-customization-list")) l.applyVisibility?.(); apply(); }));
function apply() {
  let shown = 0;
  flow.toggleAttribute("data-single", state.filter !== "all");
  for (const sec of sections) {
    const n = filterList(sec.querySelector("vsc-customization-list"), state.q);
    sec.hidden = !(state.filter === "all" || state.filter === sec.dataset.cat) || (!!state.q && n === 0);
    if (!sec.hidden) shown++;
  }
  for (const c of chips.children) c.setAttribute("aria-checked", String(c.dataset.filter === state.filter));
  $("#lib-empty").hidden = shown > 0;
  $("#lib-empty").textContent = `Nothing in your library matches "${state.q}".`;
}
chips.addEventListener("click", (e) => { const c = e.target.closest(".cp-chip"); if (c) { state.filter = c.dataset.filter; apply(); } });
$("#lib-q").addEventListener("input", (e) => { state.q = e.target.value.trim(); apply(); });
flow.addEventListener("click", (e) => {
  const head = e.target.closest(".cp-sec-head");
  if (head) { const sec = head.parentElement, c = !sec.hasAttribute("data-collapsed"); sec.toggleAttribute("data-collapsed", c); head.setAttribute("aria-expanded", String(!c)); }
});
$("#v-library").addEventListener("browse", () => setView("browse"));

// The sessions sidebar's Customizations entry opens the panel on the Library.
navCustomizations.addEventListener("click", () => {
  setPanel(true); setTab("Customizations"); setView("library");
});
setView(params.get("view") || C.view);

</script>
</body>
</html>
