<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customizations - Provenance</title>
  <link rel="stylesheet" href="../../systems/vscode/system.css">
  <script type="module" src="../../systems/vscode/system.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    vsc-workbench { width: 100vw; height: 100vh; display: block; }
    .prototype-shell { height: 100%; padding: 28px; box-sizing: border-box; }
    .editor-frame { height: 100%; min-height: 560px; overflow: hidden; border: 1px solid var(--vscode-widget-border, rgba(128,128,128,.35)); border-radius: 8px; background: var(--vscode-editor-background); box-shadow: 0 8px 28px rgba(0,0,0,.18); }
    vsc-customizations-editor { height: 100%; }
    vsc-customization-item .item-left { flex: 1 1 auto; min-width: 0; }
    .provenance-column { display: flex; align-items: center; align-self: stretch; gap: 7px; flex: 0 0 190px; width: 190px; min-width: 190px; margin-left: auto; padding: 0 12px; box-sizing: border-box; border-left: 1px solid var(--vscode-widget-border, rgba(128,128,128,.3)); color: var(--vscode-foreground); line-height: 1.15; }
    .source-mark { display: grid; place-items: center; flex: 0 0 22px; width: 22px; height: 22px; border-radius: 4px; color: var(--vscode-descriptionForeground); background: var(--vscode-textCodeBlock-background, rgba(127,127,127,.12)); }
    [data-kind="organization"] .source-mark { color: var(--vscode-activityBarBadge-foreground); background: var(--vscode-activityBarBadge-background); }
    [data-kind="team"] .source-mark { color: var(--vscode-statusBarItem-prominentForeground, var(--vscode-foreground)); background: var(--vscode-statusBarItem-prominentBackground, rgba(127,127,127,.25)); }
    .provenance-copy { display: flex; flex-direction: column; min-width: 0; }
    .provenance-label { color: var(--vscode-descriptionForeground); font-size: 10px; }
    .provenance-name { overflow: hidden; color: var(--vscode-foreground); font-size: 11px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
    .discovery-provenance { display: inline-flex; align-items: center; gap: 6px; min-width: 0; margin-left: 8px; line-height: 1.15; }
    .discovery-provenance .source-mark { flex-basis: 18px; width: 18px; height: 18px; border-radius: 3px; }
    .discovery-provenance .source-mark .codicon { font-size: 11px; }
    .discovery-provenance .provenance-copy { flex-direction: row; gap: 4px; align-items: baseline; }
    .discovery-provenance .provenance-label, .discovery-provenance .provenance-name { font-size: 11px; }
    @media (max-width: 840px) {
      .prototype-shell { padding: 12px; }
      .provenance-column { flex-basis: 38px; width: 38px; min-width: 38px; padding: 0 8px; border-left: 0; }
      .provenance-column .provenance-copy { display: none; }
    }
  </style>
</head>
<body>
  <vsc-workbench window="agents" theme="dark-2026">
    <main class="prototype-shell" aria-label="Customization provenance exploration">
      <section class="editor-frame" aria-label="Customizations editor">
        <vsc-customizations-editor section="browse" sidebar-width="200" counts="2,7,5,2,3,1,36">
          <vsc-customization-browse section="browse">
            <vsc-customization-discovery-section heading="Editor's picks" featured data-browse-state="default">
              <vsc-customization-discovery-card name="Accessibility Review" meta="Skill" description="Audit semantic HTML, labels, focus states, keyboard navigation, and color contrast." fallback-icon="lightbulb" data-source="GitHub Feed" data-source-kind="feed" data-source-icon="github"></vsc-customization-discovery-card>
              <vsc-customization-discovery-card name="Issue Triage" meta="Skill" description="Classify incoming issues and suggest the right labels, owners, and next actions." fallback-icon="lightbulb" data-source="VS Code" data-source-kind="organization" data-source-icon="organization"></vsc-customization-discovery-card>
              <vsc-customization-discovery-card name="Component Audit" meta="Skill" description="Review UI components for design-system consistency and implementation drift." fallback-icon="lightbulb" data-source="Editor Foundations" data-source-kind="team" data-source-icon="organization"></vsc-customization-discovery-card>
            </vsc-customization-discovery-section>
            <vsc-customization-discovery-section heading="Skills from GitHub Feed" show-all data-browse-state="default">
              <vsc-customization-discovery-card name="Release Notes" meta="Skill" description="Generate concise release notes from merged pull requests and linked issues." fallback-icon="lightbulb" data-source="GitHub Feed" data-source-kind="feed" data-source-icon="github"></vsc-customization-discovery-card>
              <vsc-customization-discovery-card name="Design QA" meta="Skill" description="Compare implementation screenshots against a visual specification." fallback-icon="lightbulb" data-source="GitHub Feed" data-source-kind="feed" data-source-icon="github"></vsc-customization-discovery-card>
            </vsc-customization-discovery-section>
            <vsc-customization-discovery-result name="Accessibility Review" meta="Skill" description="Audit semantic HTML, labels, focus states, keyboard navigation, and color contrast." fallback-icon="lightbulb" data-source="GitHub Feed" data-source-kind="feed" data-source-icon="github" data-search-text="accessibility review audit semantic html labels focus keyboard contrast"></vsc-customization-discovery-result>
            <vsc-customization-discovery-result name="Issue Triage" meta="Skill" description="Classify incoming issues and suggest the right labels, owners, and next actions." fallback-icon="lightbulb" data-source="VS Code" data-source-kind="organization" data-source-icon="organization" data-search-text="issue triage labels owners vscode"></vsc-customization-discovery-result>
            <vsc-customization-discovery-result name="Component Audit" meta="Skill" description="Review UI components for design-system consistency and implementation drift." fallback-icon="lightbulb" data-source="Editor Foundations" data-source-kind="team" data-source-icon="organization" data-search-text="component audit design system editor foundations"></vsc-customization-discovery-result>
            <vsc-customization-discovery-result name="Release Notes" meta="Skill" description="Generate concise release notes from merged pull requests and linked issues." fallback-icon="lightbulb" data-source="GitHub Feed" data-source-kind="feed" data-source-icon="github" data-search-text="release notes pull requests github feed"></vsc-customization-discovery-result>
          </vsc-customization-browse>
          <vsc-customization-list section="skills" kind="prompts" heading="Skills" description="Folders of instructions, scripts, and resources that Copilot loads when relevant to perform specialized tasks." link="Learn more about agent skills">
            <vsc-customization-group label="User" count="2" actions="add" add-label="New Skill" first></vsc-customization-group>
            <vsc-customization-item name="comparison-screenshot" path="~/.copilot/skills/comparison-screenshot/SKILL.md" data-source="You" data-source-kind="local" data-source-icon="person"></vsc-customization-item>
            <vsc-customization-item name="accessibility-review" path="~/.copilot/skills/accessibility-review/SKILL.md" data-source="GitHub Feed" data-source-kind="feed" data-source-icon="github"></vsc-customization-item>
            <vsc-customization-group label="Workspace" count="3" actions="add" add-label="New Skill"></vsc-customization-group>
            <vsc-customization-item name="release-notes" path=".github/skills/release-notes/SKILL.md" data-source="VS Code" data-source-kind="organization" data-source-icon="organization"></vsc-customization-item>
            <vsc-customization-item name="issue-triage" path=".github/skills/issue-triage/SKILL.md" data-source="Editor Foundations" data-source-kind="team" data-source-icon="organization"></vsc-customization-item>
            <vsc-customization-item name="component-audit" path=".github/skills/component-audit/SKILL.md" data-source="GitHub Feed" data-source-kind="feed" data-source-icon="github"></vsc-customization-item>
          </vsc-customization-list>
        </vsc-customizations-editor>
      </section>
    </main>
  </vsc-workbench>
  <script>
    const sourceMarkup = item => `<span class="source-mark"><span class="codicon codicon-${item.dataset.sourceIcon || 'organization'}" aria-hidden="true"></span></span><span class="provenance-copy"><span class="provenance-label">Managed by</span><span class="provenance-name">${item.dataset.source}</span></span>`;

    const decorateProvenance = () => {
      document.querySelectorAll('vsc-customization-item[data-source]').forEach(item => {
        const row = item.querySelector('.ai-customization-list-item');
        const actions = row?.querySelector('.item-right');
        if (!row || !actions || row.querySelector('.provenance-column')) return;
        const provenance = document.createElement('div');
        provenance.className = 'provenance-column';
        provenance.dataset.kind = item.dataset.sourceKind || 'feed';
        provenance.title = `Managed by ${item.dataset.source}`;
        provenance.setAttribute('aria-label', provenance.title);
        provenance.innerHTML = sourceMarkup(item);
        row.insertBefore(provenance, actions);
      });

      document.querySelectorAll('vsc-customization-discovery-result[data-source]').forEach(item => {
        const metadata = item.querySelector('.customization-discovery-result-detail');
        if (!metadata || item.querySelector('.discovery-provenance')) return;
        const provenance = document.createElement('div');
        provenance.className = 'discovery-provenance';
        provenance.dataset.kind = item.dataset.sourceKind || 'feed';
        provenance.title = `Managed by ${item.dataset.source}`;
        provenance.setAttribute('aria-label', provenance.title);
        provenance.innerHTML = sourceMarkup(item);
        metadata.insertAdjacentElement('afterend', provenance);
      });
    };

    Promise.all([
      customElements.whenDefined('vsc-customization-item'),
      customElements.whenDefined('vsc-customization-discovery-result'),
      customElements.whenDefined('vsc-customization-browse')
    ]).then(() => requestAnimationFrame(() => {
      decorateProvenance();
      new MutationObserver(decorateProvenance).observe(
        document.querySelector('vsc-customizations-editor'),
        { childList: true, subtree: true }
      );

      const browse = document.querySelector('vsc-customization-browse');
      const input = browse?.querySelector('input');
      const applySearch = value => {
        const query = value.trim().toLowerCase();
        browse.querySelectorAll('vsc-customization-discovery-result').forEach(card => {
          card.style.display = !query || (card.dataset.searchText || '').includes(query) ? '' : 'none';
        });
      };
      input?.addEventListener('input', event => applySearch(event.target.value));
      browse?.addEventListener('search', event => applySearch(event.detail?.query || event.detail?.value || ''));
    }));
  </script>
</body>
</html>
