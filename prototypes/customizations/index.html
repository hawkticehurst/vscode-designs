<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Customizations — Docked side panel</title>
<link rel="stylesheet" href="../../systems/vscode/system.css" />
<script type="module" src="../../systems/vscode/system.js"></script>
<script src="data.js"></script>
<script src="customizations.js"></script>
<script src="panel-config.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #121314; overflow: hidden; }
  #wb {
    /* Toast insets, as the Agents window sets them (src/vs/sessions/browser/media/workbench.css), widened to 16px so toasts clear the floating panel edge. */
    --modern-ui-notifications-inline-inset: var(--vscode-spacing-size160);
    --modern-ui-notifications-block-end-inset: var(--vscode-spacing-size160); position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column;
        background: var(--vscode-agents-background); color: var(--vscode-foreground); font-size: var(--vscode-agents-fontSize-body1); }
  #wb button { font: inherit; color: inherit; }
  /* border-box only on prototype-owned elements: VS Code widgets rely on content-box */
  :is(.tb, .page) :is(.cc, .avatar, .chip, .tab, .row, .tag, .row-actions, .preview, .cmd, .search, .dock, .inbox) { box-sizing: border-box; }
  .muted { color: var(--vscode-descriptionForeground); }
  .grow { flex: 1; }
  code, .mono { font-family: var(--monaco-monospace-font, ui-monospace, "SF Mono", Menlo, Consolas, monospace); font-size: 12px; }
  code { padding: 1px 4px; border-radius: var(--vscode-cornerRadius-small); background: var(--vscode-textPreformat-background); }

  .tb { height: 38px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; }
  .tb-center { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; }
  /* Session pill, after src/vs/sessions/contrib/sessions/browser/media/sessionsTitleBarWidget.css. */
  .cc { width: 31vw; max-width: 600px; height: 22px; display: flex; align-items: center; border-radius: var(--vscode-cornerRadius-medium); cursor: pointer;
        border: 1px solid var(--vscode-commandCenter-border); background: transparent; color: var(--vscode-commandCenter-foreground); }
  .cc:hover { background: var(--vscode-commandCenter-activeBackground); }
  .cc-pill { display: flex; align-items: center; gap: 6px; padding: 0 8px; min-width: 0; opacity: 0.6; }
  .cc-pill .codicon { font-size: var(--vscode-codiconFontSize-compact, 14px) !important; }
  .cc-label { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .avatar { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 600; flex: none;
            background: var(--vscode-chat-avatarBackground); color: var(--vscode-chat-avatarForeground); border: 1px solid var(--vscode-agentsCard-border); }
  .avatar-photo { padding: 0; overflow: hidden; cursor: pointer; }
  .avatar-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Agents window parts row: the sessions part and the docked editor part (src/vs/sessions layout), 2px apart. */
  .parts { flex: 1; min-height: 0; display: flex; margin: 0 4px 4px; }
  .side-panel { position: relative; flex: none; height: 100%; margin-left: 2px; }
  .side-panel[hidden] { display: none; }
  .side-panel vsc-agents-editor-part { height: 100%; }
  .side-panel .empty-editor { height: 100%; }
  /* Sash between the parts (monaco-sash look: invisible until hovered/dragged). */
  .panel-sash { position: absolute; top: 0; bottom: 0; left: -4px; width: 6px; z-index: 5; cursor: ew-resize; }
  .panel-sash::after { content: ""; position: absolute; top: 0; bottom: 0; left: 2px; width: 2px; background: transparent; transition: background-color 0.1s ease-out 0.3s; }
  .panel-sash:hover::after, .panel-sash.active::after { background: var(--vscode-sash-hoverBorder); }
  .page { flex: 1; min-width: 0; min-height: 0; margin: 0; border-radius: var(--vscode-cornerRadius-large); overflow-y: auto;
          background: var(--vscode-agentsPanel-background); color: var(--vscode-agentsPanel-foreground); border: 1px solid var(--vscode-agentsPanel-border); }
  /* Home: greeting and inbox from the top of the panel, with the new-session composer docked to its bottom edge. */
  #home { min-height: 100%; display: flex; flex-direction: column; }
  .greet { margin: 0 0 12px; padding-top: 24px; font-size: var(--vscode-agents-fontSize-heading1); font-weight: 400; letter-spacing: -0.015em; }
  /* Full-width backdrop so rows scrolling underneath are fully covered; the composer itself uses the session composer's
     column (800px, 16px input inset) so it doesn't jump when a session opens. */
  .dock { position: sticky; bottom: 0; z-index: 4; width: 100%; margin-top: auto; padding: 8px 0 12px; background: var(--vscode-agentsPanel-background); }
  .dock::before { content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 16px; pointer-events: none;
                  background: linear-gradient(to bottom, transparent, var(--vscode-agentsPanel-background)); }
  .dock vsc-session-view { max-width: 800px; margin: 0 auto; padding-inline: 16px; }
  .chip { height: 26px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border-radius: var(--vscode-cornerRadius-circle); cursor: pointer;
          border: 1px solid var(--vscode-agentsCard-border); background: transparent; font-size: 12px; }
  .chip:hover { background: var(--vscode-list-hoverBackground); }
  .chip.on { background: var(--vscode-list-activeSelectionBackground); border-color: transparent; }

  .inbox { width: 100%; max-width: 1040px; margin: 0 auto; padding: 0 24px 24px; }
  #tabs { display: flex; align-items: center; gap: 2px; position: sticky; top: 0; z-index: 3; background: var(--vscode-agentsPanel-background); padding: 8px 0 6px; }
  .tabs-r { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .search { height: 26px; width: 200px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: var(--vscode-cornerRadius-medium);
            background: var(--vscode-input-background); border: 1px solid var(--vscode-input-border); color: var(--vscode-input-foreground); }
  .search:focus-within { border-color: var(--vscode-focusBorder); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: inherit; font: inherit; font-size: 12px; }
  .search input::placeholder { color: var(--vscode-input-placeholderForeground); }

  /* Rows share the list's column tracks (subgrid) so harness/workspace, tags and time line up across rows. */
  .rows { padding-top: 4px; display: grid; grid-template-columns: 22px minmax(0, 1fr) 190px auto 70px; column-gap: 10px; }
  .rows > .preview, .rows > .empty { grid-column: 1 / -1; }
  .row { position: relative; display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; align-items: center; height: 40px; padding: 0 10px 0 8px;
         border-radius: var(--vscode-cornerRadius-medium); cursor: pointer; }
  /* Inset separator so it doesn't run into rounded corners; hidden around hovered/open rows. */
  .row::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 1px; background: var(--vscode-agentsCard-border); pointer-events: none; }
  .row:hover::after, .row.open::after, .row:has(+ .row:hover)::after, .row:has(+ .row.open)::after,
  .row.cur::after, .row:has(+ .row.cur)::after { opacity: 0; }
  .row:hover { background: var(--vscode-list-hoverBackground); }
  .row.open { background: var(--vscode-list-inactiveSelectionBackground); border-radius: var(--vscode-cornerRadius-medium) var(--vscode-cornerRadius-medium) 0 0; }
  /* Focus ring on the current row, drawn as a pseudo-element so it keeps all four rounded corners
     even when an open row's background squares off its bottom edge. */
  .row.cur::before { content: ""; position: absolute; inset: 0; border: 1px solid var(--vscode-focusBorder); border-radius: var(--vscode-cornerRadius-medium); pointer-events: none; }
  /* The list loses focus while typing in a composer, search box or answering a question, so drop its focus ring. */
  .page:has(:is(input, textarea, [contenteditable]):focus, vsc-chat-question-carousel:focus-within) .row.cur::before { display: none; }
  .status { display: flex; justify-content: center; }
  .status > span { display: flex; align-items: center; }
  .from { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; color: var(--vscode-descriptionForeground); }
  .from .ws { overflow: hidden; text-overflow: ellipsis; }
  .row.unread .from { color: var(--vscode-foreground); font-weight: 600; }
  .subj { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--vscode-descriptionForeground); }
  .subj .t { color: var(--vscode-foreground); }
  .row.unread .subj .t { font-weight: 600; }
  .tags { display: flex; gap: 5px; }
  .time { text-align: right; font-size: var(--vscode-agents-fontSize-label2); color: var(--vscode-descriptionForeground); white-space: nowrap; }
  .row.unread .time { color: var(--vscode-foreground); font-weight: 600; }
  .row-actions { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); display: none; padding: 1px; border-radius: var(--vscode-cornerRadius-medium);
                 background: var(--vscode-agentsPanel-background); border: 1px solid var(--vscode-agentsCard-border); }
  .row:hover .row-actions { display: flex; }
  .row:hover .time { visibility: hidden; }
  .tag { height: 18px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: var(--vscode-cornerRadius-small); font-size: var(--vscode-agents-fontSize-label2);
         border: 1px solid var(--vscode-agentsCard-border); color: var(--vscode-descriptionForeground); white-space: nowrap; }
  .tag .codicon { font-size: 12px !important; }
  /* Icon wrappers inside tags center the 12px glyph instead of sitting on the 18px line's baseline. */
  .tag > span:has(> .codicon) { display: inline-flex; align-items: center; }
  .st-input, .tag.st-input { color: var(--vscode-list-warningForeground); }
  .st-working, .tag.st-working { color: var(--vscode-textLink-foreground); }
  .st-error, .tag.st-error { color: var(--vscode-errorForeground); }
  .st-done, .tag.st-done { color: var(--vscode-testing-iconPassed); }
  .st-unread { color: var(--vscode-textLink-foreground); }
  .st-read { color: var(--vscode-agentSessionReadIndicator-foreground); }
  .add { color: var(--vscode-chat-linesAddedForeground); } .del { color: var(--vscode-chat-linesRemovedForeground); }
  .pr-open { color: var(--vscode-charts-green); } .pr-merged { color: var(--vscode-charts-purple); }
  :is(.st-input, .st-working, .st-error, .st-done, .st-unread, .st-read, .add, .del, .pr-open, .pr-merged) .codicon { color: inherit !important; }

  /* Left padding matches where the title column starts inside the row (its padding is absorbed by the shared subgrid tracks). */
  .preview { padding: 6px 16px 16px 32px; margin-bottom: 10px; background: var(--vscode-list-inactiveSelectionBackground); border-radius: 0 0 var(--vscode-cornerRadius-medium) var(--vscode-cornerRadius-medium); line-height: 1.55; }
  .preview p { margin: 0 0 8px; max-width: 760px; }
  /* Question card and reply composer share one width: both are capped at 760px and the input part's 12px side margins are removed. */
  .ask { margin: 4px 0 0; max-width: 760px; }
  /* Tight 4px gap when the reply composer directly follows a question (offsets the card margin and the input part's top padding). */
  .ask vsc-chat-question-carousel { margin-bottom: 0; }
  .ask + .reply { margin-top: -8px; }
  .ask vsc-chat-view { background: transparent; display: block; }
  .steps { margin: 2px 0 10px; display: grid; gap: 4px; }
  .step { display: flex; align-items: center; gap: 8px; }
  .step.todo { color: var(--vscode-descriptionForeground); }
  a.link { color: var(--vscode-textLink-foreground); text-decoration: none; cursor: pointer; }
  a.link:hover { text-decoration: underline; }
  .reply { margin-top: 12px; max-width: 760px; }
  /* The reply composer sits flush with the preview's text, on the preview's own background. */
  .reply vsc-session-view { --session-view-content-horizontal-padding: 0px; --vscode-activeSessionView-background: transparent; }
  /* Opens the expanded session's full chat; floats beside the first paragraph so it costs no extra row. */
  .open-full { float: right; margin: -2px -6px 4px 16px; height: 24px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px 0 8px;
               border: 0; border-radius: var(--vscode-cornerRadius-medium); background: transparent; color: var(--vscode-textLink-foreground); font: inherit; font-size: 12px; cursor: pointer; }
  .open-full:hover { background: var(--vscode-toolbar-hoverBackground); }
  .open-full:focus-visible { outline: 1px solid var(--vscode-focusBorder); outline-offset: -1px; }
  .open-full .codicon { font-size: 14px !important; color: inherit !important; }

  /* Visual changes: before/after screenshots the agent captured, with a side-by-side or swipe comparison and the session's decision. */
  /* Border-box so its 760px cap matches the reply composer's outer edge exactly. */
  .vc { container-type: inline-size; box-sizing: border-box; max-width: 760px; margin: 4px 0 12px; border: 1px solid var(--vscode-widget-border, var(--vscode-panel-border)); border-radius: var(--vscode-cornerRadius-large, 8px);
        background: var(--vscode-editorWidget-background); overflow: hidden; line-height: normal; }
  .vc-head { display: flex; flex-wrap: nowrap; align-items: center; gap: 2px 8px; min-height: 36px; box-sizing: border-box; padding: 4px 4px 4px 12px; }
  /* The toolbar keeps the title's line; a long question wraps instead. */
  .vc-title { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 600; line-height: 18px; }
  .vc-title .codicon { flex: none; }
  .vc-title:has(.codicon-report-question) .codicon { color: var(--vscode-list-warningForeground) !important; }
  .vc-tools { flex: none; margin-left: auto; }
  .vc-sep { width: 1px; height: 16px; margin: 0 4px; align-self: center; background: var(--vscode-widget-border, var(--vscode-panel-border)); }
  /* Option tabs: the inbox's pill tabs, sized down to sit in the After label. */
  /* Same height whether or not the label holds option tabs, so side-by-side screenshots start on the same line. */
  .vc-lab { display: flex; align-items: center; gap: 6px; min-width: 0; height: 32px; }
  .vc-lab vsc-view-tabs { min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .vc-lab vsc-view-tabs .composite.title { width: max-content; }
  .vc-body { display: grid; gap: 12px; padding: 0 12px 12px; }
  .vc-body.split:not(.stack) { grid-template-columns: 1fr 1fr; }
  /* Narrow cards: portrait shots stay side by side (small, but comparable at a glance; Expand for detail), the option tabs
     become a dropdown in the After label, and the labels drop their branch chips. */
  .vc-lab vsc-select { display: none; }
  .vc-lab vsc-select { position: relative; }
  .vc-lab vsc-select select { appearance: none; width: 100%; height: 24px; padding: 0 22px 0 6px; border: 1px solid; border-radius: var(--vscode-cornerRadius-small); font: inherit; font-size: 12px; text-overflow: ellipsis; }
  /* A chevron so it reads as a dropdown (codicon chevron-down). */
  .vc-lab vsc-select::after { content: "\eab4"; position: absolute; right: 5px; top: 50%; translate: 0 -50%; font: 14px/1 codicon; color: var(--vscode-dropdown-foreground); pointer-events: none; }
  @container (max-width: 480px) {
    .vc-body.split:not(.stack) { gap: 8px; }
    .vc-lab vsc-view-tabs, .vc-lab code { display: none; }
    .vc-lab vsc-select { display: block; flex: 1; min-width: 0; max-width: 180px; }
  }
  .vc-pane { margin: 0; display: grid; gap: 6px; min-width: 0; }
  .vc-pane figcaption { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; line-height: 16px; color: var(--vscode-descriptionForeground); }
  .vc-pane figcaption b { font-weight: 600; color: var(--vscode-foreground); }
  .vc-pane figcaption code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vc-shot { position: relative; line-height: 0; border: 1px solid var(--vscode-widget-border, var(--vscode-panel-border)); border-radius: var(--vscode-cornerRadius-medium); }
  .vc-shot img { display: block; width: 100%; height: auto; border-radius: calc(var(--vscode-cornerRadius-medium) - 1px); }
  /* Swipe: the after image sits over the before image and is clipped at the handle. */
  .vc-swipe { --pos: 50%; position: relative; line-height: 0; cursor: ew-resize; touch-action: none; user-select: none; -webkit-user-select: none;
              border: 1px solid var(--vscode-widget-border, var(--vscode-panel-border)); border-radius: var(--vscode-cornerRadius-medium); overflow: hidden; }
  .vc-swipe img { display: block; width: 100%; height: auto; pointer-events: none; }
  .vc-swipe img.after { position: absolute; inset: 0; clip-path: inset(0 0 0 var(--pos)); }
  /* Swipe labels sit above the image so they never cover the change. */
  .vc-swipe-cap { justify-content: space-between; gap: 12px; }
  .vc-handle { position: absolute; z-index: 2; top: 0; bottom: 0; left: var(--pos); width: 2px; translate: -1px 0; background: var(--vscode-focusBorder); outline: none; }
  .vc-handle .grip { position: absolute; top: 50%; left: 50%; translate: -50% -50%; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
                     background: var(--vscode-editorWidget-background); border: 1px solid var(--vscode-focusBorder); color: var(--vscode-foreground); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); }
  .vc-handle .grip .codicon { font-size: 14px !important; }
  .vc-handle:focus-visible .grip { outline: 2px solid var(--vscode-focusBorder); outline-offset: 1px; }
  .vc-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--vscode-widget-border, var(--vscode-panel-border)); }
  .vc-hint { flex: 1 1 auto; display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--vscode-descriptionForeground); font-size: 12px; line-height: 16px; }
  .vc-hint .codicon { flex: none; font-size: 14px !important; color: inherit !important; }
  /* Dialog-style buttons: sized to their label, not the full width of a .monaco-text-button. */
  /* Actions stay right-aligned, also when the hint wraps them onto their own line. */
  .vc-actions { display: flex; gap: 8px; margin-left: auto; }
  .vc-foot vsc-button { flex: none; width: auto; min-width: 80px; padding: 4px 12px; }
  /* Expanded comparison: a modal over the window with the same card, larger. */
  .vc-lightbox { position: fixed; inset: 0; z-index: 2500; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: rgba(0, 0, 0, 0.5); }
  .vc-lightbox .vc { width: min(1200px, 100%); max-width: none; max-height: 100%; margin: 0; overflow: auto; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); }
  .vc-lightbox .vc-body.split:not(.stack) { gap: 16px; }
  /* Anchored 4px above the composer, like the question card: inline before a reply, and in a session's composer area. */
  .preview .vc:has(+ .reply) { margin-bottom: 0; }
  .preview .vc + .reply { margin-top: 0; }
  .s-ask .vc { max-width: none; margin: 0 0 8px; }
  /* In a session's transcript the card spans the chat column, the same width as the composer below. */
  .s-chat .vc { max-width: none; }
  /* The composer area stays compact: shots are capped in height and shrink to their own width (so the swipe overlay still lines up). */
  .s-ask .vc-shot, .s-ask .vc-swipe { width: fit-content; max-width: 100%; margin: 0 auto; }
  .s-ask :is(.vc-shot, .vc-swipe) img { width: auto; max-width: 100%; max-height: min(34vh, 320px); }
  .s-ask .vc-swipe img.after { width: 100%; height: 100%; }
  @media (max-width: 600px) { .vc-lightbox { padding: 8px; } }

  /* Full session: header, transcript and a composer pinned to the bottom of the panel. */
  #home[hidden], .session[hidden] { display: none; }
  .session { min-height: 100%; display: flex; flex-direction: column; }
  /* Session title bar: status, title and an overflow menu (navigation lives in the window title bar). */
  /* Same column as the transcript and composer: 800px max, with the chat items' 16px side padding. */
  .s-head { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; box-sizing: border-box; width: 100%; max-width: 800px; height: 40px;
            margin: 0 auto; padding: 0 16px; background: var(--vscode-agentsPanel-background); }
  .s-status { display: flex; }
  .s-head h2 { flex: 1; min-width: 0; margin: 0; font-size: 13px; font-weight: 400; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s-chat { flex: 1; width: 100%; max-width: 800px; margin: 0 auto; padding-bottom: 8px; }
  .s-chat vsc-chat-view, .s-composer vsc-chat-view { background: transparent; display: block; }
  .s-composer { position: sticky; bottom: 0; z-index: 2; width: 100%; max-width: 800px; margin: 0 auto; padding-bottom: 12px; background: var(--vscode-agentsPanel-background); }
  /* The session composer centers its input part; inset it 16px like the session header and transcript. */
  .s-composer vsc-session-view { --session-view-content-horizontal-padding: 16px; }
  /* A pending question sits just above the composer (like the product's chat input), not in the transcript. */
  /* The card's 8px bottom margin plus the input part's top padding would leave 12px; pull the composer up to a 4px gap. */
  .s-ask { margin: 0 16px -8px; }

  .page .empty { padding: 56px 24px; text-align: center; color: var(--vscode-descriptionForeground); }
  .page .empty .codicon { font-size: 28px !important; display: block; margin-bottom: 8px; }

  /* Menu item under the pointer (VS Code applies these selection colors from JS). */
  vsc-menu vsc-menu-item.focused > a.action-menu-item { background: var(--vscode-menu-selectionBackground); border-radius: var(--vscode-cornerRadius-medium); }
  vsc-menu vsc-menu-item.focused > a.action-menu-item, vsc-menu vsc-menu-item.focused > a.action-menu-item > span { color: var(--vscode-menu-selectionForeground) !important; }
  /* From vs/base/browser/ui/dialog/dialog.css (not part of the captured component CSS). */
  vsc-dialog.monaco-dialog-modal-block { position: fixed; height: 100%; width: 100%; left: 0; top: 0; z-index: 2575; display: flex; justify-content: center; align-items: center; }
  vsc-dialog.monaco-dialog-modal-block.dimmed { background: rgba(0, 0, 0, 0.5); }
  /* The inbox adapts to the width the side panel leaves it (container queries on the page, not the viewport). */
  .page { container-type: inline-size; }
  @container (max-width: 1100px) { .rows { grid-template-columns: 22px minmax(0, 1fr) 140px 64px; } .row .tags { display: none; } }
  @container (max-width: 720px) {
    .rows { grid-template-columns: 22px minmax(0, 1fr) 64px; }
    .row .from, .row .tags { display: none; }
    .search { width: 96px; }
  }

  /* ---- Phone (≤ 640px) ---- */
  @media (max-width: 640px) {
    /* Title bar: sidebar toggle, session pill (fills the space), theme toggle and avatar. Navigation, run and layout actions are desktop-only. */
    .tb { gap: 6px; padding: 0 8px; }
    .tb-center { position: static; transform: none; flex: 1; min-width: 0; }
    .tb-center + .grow { display: none; }
    .tb-nav, .tb-run, .tb-layout { display: none; }
    .cc { width: auto; flex: 1; min-width: 0; }

    .parts { margin: 0 4px 4px; }
    .side-panel { display: none; }
    .greet { font-size: 22px; padding-top: 16px; margin-bottom: 8px; }
    .inbox { padding: 0 8px 16px; }
    .dock { padding: 6px 0 8px; }
    .dock vsc-session-view { padding-inline: 8px; }

    /* Tabs scroll horizontally on their own row; search (filling the width) and the filter button sit below. */
    #tabs { flex-wrap: wrap; row-gap: 6px; padding: 6px 0; }
    #tabs vsc-view-tabs { flex: 1 1 100%; min-width: 0; overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain;
                          mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); }
    #tabs vsc-view-tabs::-webkit-scrollbar { display: none; }
    #tabs vsc-view-tabs .composite.title { width: max-content; }
    .tabs-r { flex: 1 1 100%; margin-left: 0; flex-direction: row-reverse; }
    .search { flex: 1; width: auto; height: 28px; }
    .search input { font-size: 13px; }

    /* Rows: status, title and time only. Actions show on the open row instead of on hover (no hover on touch). */
    .rows { grid-template-columns: 18px minmax(0, 1fr) auto; column-gap: 8px; }
    .row .from, .row .tags { display: none; }
    .row { height: 44px; padding: 0 8px 0 6px; }
    .row:hover .row-actions { display: none; }
    .row:hover .time { visibility: visible; }
    .row.open .row-actions { display: flex; }
    .row.open .time { visibility: hidden; }

    /* Expanded content uses the full width. */
    .preview { padding: 2px 10px 12px; }
    .preview p { max-width: none; }


    /* Toasts span the window width (as in the Agents window phone layout, src/vs/sessions/browser/media/phoneLayout.css). */
    #toasts { left: 8px; right: 8px; }
    #toasts .notifications-list-container { width: auto !important; }
    #toasts .notification-toast { width: auto; }
  }
</style>
</head>
<body>
<vsc-workbench id="wb" theme="dark-2026" window="agents" class="nostatusbar">
  <header class="tb">
    <vsc-toolbar label="Window"><vsc-action icon="layout-sidebar-left-off" label="Show Sessions Sidebar"></vsc-action></vsc-toolbar>
    <div class="tb-center">
      <vsc-toolbar class="tb-nav" label="Session Navigation"><vsc-action icon="arrow-left" label="Go Back" id="nav-back"></vsc-action><vsc-action icon="arrow-right" label="Go Forward" id="nav-fwd" disabled></vsc-action></vsc-toolbar>
      <div class="cc" role="button" tabindex="0" aria-label="Show Sessions: No workspace"><div class="cc-pill"><span class="codicon codicon-comment-discussion" aria-hidden="true"></span><span class="cc-label">No workspace</span></div></div>
      <vsc-toolbar class="tb-run" label="Session Actions"><vsc-action icon="play" label="Run" disabled></vsc-action><vsc-action icon="vscode-insiders" label="Open in VS Code - Insiders"></vsc-action></vsc-toolbar>
    </div>
    <div class="grow"></div>
    <vsc-toolbar class="tb-layout" label="Layout">
      <vsc-action icon="layout-panel-off" label="Show Panel (⌘J)"></vsc-action>
      <vsc-action icon="layout-sidebar-right" label="Toggle Side Panel (⌥⌘B)" id="toggle-panel" checked></vsc-action>
      <vsc-action icon="radio-tower" label="Remote Access"></vsc-action>
    </vsc-toolbar>
    <button class="avatar avatar-photo" title="hawkticehurst" aria-label="Accounts: hawkticehurst"><img src="assets/profile.jpg" alt="" /></button>
  </header>
  <div class="parts">
  <main class="page" id="page">
    <div id="home">
    <section class="inbox" aria-label="Inbox">
      <h1 class="greet" id="greet">Good afternoon, Hawk</h1>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="rows" id="rows" role="list"></div>
    </section>
    <section class="dock" aria-label="New session">
      <vsc-session-view variant="new"><vsc-chat-input id="composer" variant="new-session" placeholder="What should agents work on?" workspace="vscode" isolation="worktree"></vsc-chat-input></vsc-session-view>
    </section>
    </div>
    <section class="session" id="session" aria-label="Session" hidden></section>
  </main>
  <aside class="side-panel" id="side-panel" aria-label="Side Panel">
    <div class="panel-sash" id="panel-sash" role="separator" aria-orientation="vertical"></div>
    <vsc-agents-editor-part id="editor-part" tabs="Changes,Files,Customizations" active="Customizations">
      <vsc-customizations-editor id="cust" section="browse" style="height: 100%;"></vsc-customizations-editor>
    </vsc-agents-editor-part>
  </aside>
  <script>
    // Runs while the page parses, before system.js upgrades the elements (they read their slotted children once).
    (function () {
      const C = window.PANEL_CONFIG, cust = document.getElementById("cust"), part = document.getElementById("editor-part"), panel = document.getElementById("side-panel");
      cust.setAttribute("sidebar-width", String(C.sidebarWidth));
      cust.setAttribute("section", new URLSearchParams(location.search).get("section") || C.section);
      window.renderCustomizationsEditor(cust);
      part.setAttribute("tabs", C.tabs.join(","));
      part.setAttribute("active", C.active);
      panel.style.width = C.width + "px";
      panel.hidden = !C.open;
    })();
  </script>
  </div>
  <vsc-notification-toasts id="toasts" position="bottom-right"></vsc-notification-toasts>
</vsc-workbench>

<script type="module">
const D = window.INBOX_DATA;
const H = D.harnesses;
const WS = Object.fromEntries(D.workspaces.map(w => [w.id, w]));
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const icon = (n, extra = "") => `<vsc-icon name="${n}"${extra}></vsc-icon>`;

const wb = $("#wb");

const state = { tab: "ready", q: "", open: null, cur: null, view: null, lastView: null, homeScroll: 0, sessions: D.sessions.map(s => ({ ...s })), seq: 100, showDone: true };
// The Agents window composer's picker data (harnesses, models, modes, workspaces), from the design system.
const P = window.ds.vscode.chatPickers;
const modelId = (name) => Object.values(P.data.models.catalog).find(m => m.name === name)?.id;
// The new-session workspace picker lists real recent folders; a session started in one the inbox doesn't know yet gets an entry.
function workspaceFor(id) {
  if (!WS[id]) { const o = P.find(P.data.workspaces, id); WS[id] = { id, label: o && !o.noWorkspace ? o.label : "No workspace", repo: o?.description ?? "" }; }
  return id;
}

// On-hold sessions live only in the On hold tab until taken off hold, marked done or replied to.
const TABS = [
  { id: "ready", label: "Ready for you", test: s => !s.onHold && !s.merging && (s.state === "input" || s.state === "review" || s.state === "error") },
  { id: "working", label: "Working", test: s => !s.onHold && !s.merging && s.state === "working" },
  { id: "merge", label: "Ready to merge", test: s => !!s.merging && s.state !== "done" },
  { id: "hold", label: "On hold", test: s => s.onHold && !s.merging && s.state !== "done" },
  { id: "done", label: "Done", test: s => s.state === "done" },
];

// Filter menu (mirrors the Agents window's Filter Sessions menu: unchecked options are excluded).
// Environments: Local and Worktree both run on This Computer; anything other than Cloud is a remote agent host (e.g. devbox-1).
const environmentOf = (s) => s.env === "Local" || s.env === "Worktree" ? "local" : s.env === "Cloud" ? "cloud" : s.env;
const remoteHosts = [...new Set(D.sessions.map(environmentOf).filter(e => e !== "local" && e !== "cloud"))];
const FILTER_GROUPS = [
  { id: "env", label: "Environment", options: [["local", "This Computer"], ["cloud", "Cloud"], ...remoteHosts.map(h => [h, h])], value: environmentOf },
  { id: "ws", label: "Workspace", options: D.workspaces.map(w => [w.id, w.label]), value: s => s.workspace },
  { id: "harness", label: "Harness", options: Object.entries(H).map(([id, h]) => [id, h.label]), value: s => s.harness },
];
const excluded = Object.fromEntries(FILTER_GROUPS.map(g => [g.id, new Set()]));
const hasFilters = () => FILTER_GROUPS.some(g => excluded[g.id].size) || !state.showDone;
const visibleTabs = () => TABS.filter(t => t.id !== "done" || state.showDone);
const passesFilters = (s) => FILTER_GROUPS.every(g => !excluded[g.id].has(g.value(s)));

const visible = () => {
  const t = TABS.find(x => x.id === state.tab).test, q = state.q.toLowerCase();
  const list = state.sessions.filter(s => t(s) && passesFilters(s) && (!q || [s.title, s.preview, s.branch, WS[s.workspace].label].join(" ").toLowerCase().includes(q)));
  // In Ready for you, sessions waiting on an answer come first; otherwise by recency.
  const rank = (s) => state.tab === "ready" && s.state === "input" ? 0 : 1;
  return list.map((s, i) => [s, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map(([s]) => s);
};

// Mirrors SessionsListModelService.getStatusIcon in microsoft/vscode (src/vs/sessions).
function statusIcon(s) {
  if (s.state === "input") return `<span class="st-input" title="Needs input">${icon("report-question")}</span>`;
  if (s.state === "working") return `<span class="st-working" title="In progress">${icon("session-in-progress")}</span>`;
  if (s.state === "error") return `<span class="st-error" title="Failed">${icon("error")}</span>`;
  if (s.state === "done") return `<span class="st-read" title="Done">${icon("pass-filled")}</span>`;
  return s.unread ? `<span class="st-unread" title="Unread">${icon("circle-filled")}</span>` : `<span class="st-read" title="Read">${icon("circle-small-filled")}</span>`;
}
const diffStat = (s) => ({ a: s.files.reduce((n, f) => n + f[1], 0), d: s.files.reduce((n, f) => n + f[2], 0), n: s.files.length });
function tags(s) {
  const out = [];
  if (s.merging) out.push(`<span class="tag">${icon("git-merge")}${esc(s.merging.status)}</span>`);
  else if (s.state === "working") { const d = s.steps.filter(x => x[1] === "done").length; out.push(`<span class="tag st-working">${d + 1}/${s.steps.length}</span>`); }
  if (s.pr) out.push(`<span class="tag"><span class="${s.pr.status === "Merged" ? "pr-merged" : "pr-open"}">${icon("git-pull-request")}</span>#${s.pr.num}</span>`);
  if (s.visual) out.push(`<span class="tag" title="Includes before and after screenshots">${icon("file-media")}Visual</span>`);
  const { a, d, n } = diffStat(s);
  if (n) out.push(`<span class="tag"><span class="add">+${a}</span><span class="del">−${d}</span></span>`);
  return out.join("");
}

// Hover actions per bucket. "redo" always means "send it back where it came from".
function rowActions(s) {
  const a = (ic, label, act) => `<vsc-action icon="${ic}" label="${label}" data-act="${act}"></vsc-action>`;
  if (s.state === "done") return a("redo", "Restore", "done") + a("trash", "Delete... (Delete)", "delete");
  if (s.merging) return a("redo", `Move Back to ${s.state === "working" ? "Working" : "Ready for You"} (M)`, "merge") + a("check", "Mark as Done (E)", "done");
  if (s.onHold) return a("redo", "Take Off Hold (H)", "hold") + a("check", "Mark as Done (E)", "done");
  return a("clock", "Put On Hold (H)", "hold") + (s.state === "review" ? a("git-merge", "Ready to Merge (M)", "merge") : "") + a("check", "Mark as Done (E)", "done");
}

// Ready to merge: an agent babysits the PR; this simulates it merging a little later, which moves the session to Done.
const MERGE_DELAY_MS = 15000;
function scheduleMerge(s) {
  clearTimeout(s._mergeTimer);
  s._mergeTimer = setTimeout(() => {
    if (!s.merging || s.state === "done") return;
    s.merging = null; s.state = "done"; s.unread = false; s.onHold = false; s.time = "now";
    if (s.pr) s.pr.status = "Merged";
    if (state.open === s.id) state.open = null;
    render(); toast(`${s.pr ? `#${s.pr.num}` : `"${s.title}"`} merged. Moved to Done.`);
  }, MERGE_DELAY_MS);
}

function renderGreeting() {
  const h = new Date().getHours();
  $("#greet").textContent = `Good ${h < 12 ? "morning" : h < 18 ? "afternoon" : "evening"}, ${D.user.name}`;
}
function renderTabs() {
  $("#tabs").innerHTML = `<vsc-view-tabs label="Inbox" active="${state.tab}">${visibleTabs().map(t => {
    const items = state.sessions.filter(t.test), unread = items.filter(s => s.unread).length;
    const count = t.id === "done" ? "" : ` count="${t.id === "ready" && unread ? unread : items.length}"`;
    return `<vsc-view-tab value="${t.id}"${count}>${t.label}</vsc-view-tab>`;
  }).join("")}</vsc-view-tabs>` + `<div class="tabs-r"><vsc-toolbar label="Inbox"><vsc-action icon="filter" label="Filter Sessions" id="filter-btn" dropdown${hasFilters() ? " checked" : ""}></vsc-action></vsc-toolbar>
    <label class="search"><input id="q" placeholder="Search" value="${esc(state.q)}" autocomplete="off" /></label></div>`;
  $("#q").addEventListener("input", (e) => { state.q = e.target.value; renderRows(); });
  // In the scrolling tab strip (phones), keep the active tab in view.
  requestAnimationFrame(() => {
    const bar = $("#tabs vsc-view-tabs"), tab = bar?.querySelector("vsc-view-tab.checked");
    if (!bar || !tab || bar.scrollWidth <= bar.clientWidth) return;
    const b = bar.getBoundingClientRect(), t = tab.getBoundingClientRect();
    if (t.right > b.right - 24) bar.scrollLeft += t.right - b.right + 32;
    else if (t.left < b.left) bar.scrollLeft -= b.left - t.left + 8;
  });
}

function detailHtml(s) {
  let body = `<button class="open-full" data-open-full title="Open the full chat session">Open session${icon("arrow-right")}</button>`;
  for (const r of s.replies || []) body += `<p class="muted">${icon("reply")} You replied: ${esc(r)}</p>`;
  if (s.state === "working") {
    body += `<div class="steps">${s.steps.map(([l, st]) => `<div class="step ${st}">${st === "done" ? `<span class="st-done">${icon("pass")}</span>` : st === "active" ? `<span class="st-working">${icon("loading", " spin")}</span>` : icon("circle-large-outline")}${md(l)}</div>`).join("")}</div>`;
  } else {
    body += (s.body || []).map(p => `<p>${p}</p>`).join("");
    body += visualHtml(s);
  }
  if (s.state === "input" && !choiceInCard(s)) body += `<div class="ask"><vsc-chat-view>${carouselHtml(s)}</vsc-chat-view></div>`;
  if (s.state !== "done") body += `<div class="reply">${composerHtml(s)}</div>`;
  return `<div class="preview">${body}</div>`;
}
// Design-system chat question carousel; the first option starts selected, like the product's auto-select on focus.
function carouselHtml(s) {
  return `<vsc-chat-question-carousel question="${esc(s.question.text)}">
      ${s.question.command ? `<div slot="detail"><pre><code>${esc(s.question.command)}</code></pre></div>` : ""}
      ${s.question.options.map((o, i) => `<vsc-chat-question-option label="${esc(o)}"${i ? "" : " selected"}></vsc-chat-question-option>`).join("")}
    </vsc-chat-question-carousel>`;
}
// An open session's composer: the Agents window's session layout with that session's harness, model, mode and permissions.
function composerHtml(s) {
  const attrs = {
    variant: "session", placeholder: `Reply to ${H[s.harness].label}…`, harness: s.harness, model: modelId(s.model),
    environment: s.env === "Cloud" ? "cloud" : "local", mode: s.mode, permissions: s.permissions, approvals: s.approvals, "agent-mode": s.agentMode, "data-session": s.id,
  };
  return `<vsc-session-view><vsc-chat-input ${Object.entries(attrs).filter(([, v]) => v).map(([k, v]) => `${k}="${esc(v)}"`).join(" ")} notice></vsc-chat-input></vsc-session-view>`;
}

// ---- Visual changes: before/after screenshots for sessions whose change is visual ----
// Shots live in assets/shots as {key}-{dark|light}.png and follow the window's theme, or as {key}.png when the UI has its own (themed: false).
const isLight = () => /light/i.test(wb.getAttribute("data-theme") || wb.getAttribute("theme") || "");
const shotSrc = (key) => `assets/shots/${key}-${isLight() ? "light" : "dark"}.png`;
const vcState = (s) => s._vc ||= { mode: s.visual.mode || "split", pick: 0, pos: 50 };
// The card offers the session's decision while one is pending: pick an option (a question with screenshot options) or review a PR.
const vcDecision = (s) => s.state === "input" && s.answerIndex == null && s.visual.after.length > 1 ? "choose" : s.state === "review" && !s.merging && !s.onHold ? "review" : null;
// A question whose options each have a screenshot is answered from the comparison card, so the question card isn't shown too.
const choiceInCard = (s) => !!s.question && s.visual?.after.some(a => a.option != null);
// While that choice is pending, the card sits just above the composer like a question card; once answered it joins the transcript.
const pendingChoice = (s) => s.state === "input" && s.answerIndex == null && choiceInCard(s);
function visualHtml(s, { large = false } = {}) {
  const v = s.visual; if (!v) return "";
  const st = vcState(s), after = v.after[st.pick] || v.after[0], decision = vcDecision(s), multi = v.after.length > 1;
  const img = (key, cls = "", alt = "") => v.themed === false ? `<img class="${cls}" src="assets/shots/${key}.png" alt="${esc(alt)}" draggable="false">`
    : `<img data-shot="${key}" class="${cls}" src="${shotSrc(key)}" alt="${esc(alt)}" draggable="false">`;
  // With several "after" shots, tabs switch between them (the agent's options); otherwise the After label names the branch.
  // Wide cards show tabs in the After label; narrow ones a dropdown in its place (CSS picks one).
  const optTabs = multi ? `<vsc-view-tabs label="Options" active="${st.pick}">${v.after.map((a, i) => `<vsc-view-tab value="${i}">${esc(a.label)}</vsc-view-tab>`).join("")}</vsc-view-tabs>` : "";
  const optSelect = multi ? `<vsc-select label="Option to compare" options="${esc(v.after.map(a => a.label).join(","))}" value="${esc(after.label)}"></vsc-select>` : "";
  const afterLabel = multi ? optTabs + optSelect : `<code>${esc(after.label)}</code>`;
  const before = `<span class="vc-lab"><b>Before</b><code>main</code></span>`, afterCap = `<span class="vc-lab after"><b>After</b>${afterLabel}</span>`;
  const body = st.mode === "swipe"
    ? `<figure class="vc-pane"><figcaption class="vc-swipe-cap">${before}${afterCap}</figcaption>
      <div class="vc-swipe" style="--pos:${st.pos}%" data-vc-swipe="${s.id}">
        ${img(v.before, "", `Before: ${v.caption}`)}${img(after.key, "after", `After: ${v.caption}`)}
        <div class="vc-handle" role="slider" tabindex="0" aria-label="Before and after divider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(st.pos)}"><span class="grip">${icon("arrow-both")}</span></div>
      </div></figure>`
    : `<figure class="vc-pane before"><figcaption>${before}</figcaption><div class="vc-shot">${img(v.before, "", `Before: ${v.caption}`)}</div></figure>
       <figure class="vc-pane after"><figcaption>${afterCap}</figcaption><div class="vc-shot">${img(after.key, "", `After: ${v.caption}`)}</div></figure>`;
  // Request Changes is always offered while you can still reply; the primary action only while its decision is open.
  let foot = "";
  if (s.state !== "done") {
    const hint = st.mode === "swipe" ? `${icon("arrow-both")}Drag the divider to compare.` : "";
    const primary = decision === "choose" ? `<vsc-button data-vc-do="choose">Choose ${esc(after.label)}</vsc-button>`
      : decision === "review" ? `<vsc-button data-vc-do="merge">Ready to Merge</vsc-button>` : "";
    foot = `<div class="vc-foot">${hint ? `<span class="vc-hint">${hint}</span>` : ""}<span class="vc-actions"><vsc-button secondary data-vc-do="changes">Request Changes</vsc-button>${primary}</span></div>`;
  }
  // A card that answers the agent's question leads with the question; the view toggles and Expand are icon actions.
  const asks = multi && s.question && choiceInCard(s);
  const toggle = (mode, ic, label) => `<vsc-action icon="${ic}" label="${label}" data-vc-do="mode" data-v="${mode}" checked="${st.mode === mode}"></vsc-action>`;
  return `<section class="vc" data-vc="${s.id}" aria-label="Visual changes">
    <div class="vc-head"><span class="vc-title">${icon(asks ? "report-question" : "file-media")}${esc(asks ? s.question.text : "Visual changes")}</span>
      <vsc-toolbar label="Visual changes" class="vc-tools" highlight-toggled>${toggle("split", "split-horizontal", "Side by Side")}${toggle("swipe", "arrow-both", "Swipe")}<span class="vc-sep"></span>
        <vsc-action icon="${large ? "close" : "screen-full"}" label="${large ? "Close (Escape)" : "Expand"}" data-vc-do="${large ? "close" : "expand"}"></vsc-action></vsc-toolbar></div>
    <div class="vc-body ${st.mode}${v.layout === "stack" ? " stack" : ""}">${body}</div>${foot}
  </section>`;
}
// Focus is restored for keyboard users only, so a mouse click doesn't leave a focus ring behind.
let lastInput = "pointer";
addEventListener("keydown", () => { lastInput = "key"; }, true);
addEventListener("pointerdown", () => { lastInput = "pointer"; }, true);
function refreshVisual(s, focusSel) {
  // Re-rendering replaces the card; keep keyboard focus on the same control (or the newly selected option tab).
  const a = document.activeElement?.closest?.(".vc [data-vc-do], .vc vsc-view-tab, .vc vsc-select");
  const sel = focusSel ?? (a?.localName === "vsc-view-tab" ? "vsc-view-tab[checked]" : a?.localName === "vsc-select" ? "vsc-select select" : a ? `[data-vc-do="${a.dataset.vcDo}"]${a.dataset.v != null ? `[data-v="${a.dataset.v}"]` : ""}` : null);
  document.querySelectorAll(`.vc[data-vc="${s.id}"]`).forEach(el => {
    const large = !!el.closest(".vc-lightbox");
    el.outerHTML = visualHtml(s, { large });
  });
  if (sel && lastInput === "key") requestAnimationFrame(() => {
    // The option tabs exist twice (After label and their own row); focus the visible copy.
    const t = [...(lightbox || document).querySelectorAll(`.vc[data-vc="${s.id}"] ${sel}`)].find(x => x.offsetParent);
    (t?.localName === "vsc-action" ? t.querySelector("a") : t)?.focus();
  });
}
// The composer this session's reply goes to: the full session's, or the inbox preview's.
const replyEditor = (s) => state.view === s.id ? $("#session .s-composer .dt-editor-text") : $("#rows .preview .reply .dt-editor-text");
function focusEnd(ed) {
  ed.focus();
  const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
}
let lightbox = null;
function openLightbox(s) {
  closeLightbox();
  lightbox = document.createElement("div");
  lightbox.className = "vc-lightbox"; lightbox.setAttribute("role", "dialog"); lightbox.setAttribute("aria-modal", "true"); lightbox.setAttribute("aria-label", `Visual changes: ${s.title.replace(/`/g, "")}`);
  lightbox._return = document.activeElement;
  lightbox.innerHTML = visualHtml(s, { large: true });
  wb.append(lightbox);
  requestAnimationFrame(() => lightbox?.querySelector(".monaco-custom-radio .active")?.focus());
}
function closeLightbox() {

    openSubmenu(parentItem, true);
    focusItem(menus[1], menus[1].querySelector(`[data-opt="${id}"]`));
  });
}
$("#page").addEventListener("scroll", closeMenus, { passive: true });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && menus.length) { e.stopImmediatePropagation(); closeMenus(); } }, true);
$("#rows").addEventListener("click", (e) => {
  if (e.target.closest("[data-open-full]")) { openSession(state.open); return; }
  const a = e.target.closest("[data-act]");
  const row = e.target.closest(".row"), id = row?.dataset.id || state.open;
  const s = state.sessions.find(x => x.id === id);
  if (a && s) { e.stopPropagation(); act(s, a.dataset.act); return; }
  if (row) toggle(row.dataset.id);
});
// Answers from the question carousel go back to the agent like a reply; skipping lets it continue with its defaults.
$("#rows").addEventListener("submit", (e) => {
  const s = state.sessions.find(x => x.id === state.open);
  if (s && e.target.localName === "vsc-chat-question-carousel" && e.detail.answer) answer(s, e.detail.answer);
});
$("#rows").addEventListener("skip", () => {
  const s = state.sessions.find(x => x.id === state.open);
  if (s) answer(s, "Skipped the question");
});
$("#session").addEventListener("click", (e) => {
  const s = state.sessions.find(x => x.id === state.view);
  if (s && e.target.closest("#session-more")) { menus.length ? closeMenus() : openSessionMenu(s); }
});
$("#session").addEventListener("submit", (e) => {
  const s = state.sessions.find(x => x.id === state.view);
  if (s && e.target.localName === "vsc-chat-question-carousel" && e.detail.answer) answer(s, e.detail.answer);
});
$("#session").addEventListener("skip", () => {
  const s = state.sessions.find(x => x.id === state.view);
  if (s) answer(s, "Skipped the question");
});
$("#nav-back").addEventListener("click", closeSession);
$("#nav-fwd").addEventListener("click", () => { if (!state.view && state.lastView) openSession(state.lastView); });

wireComposer($(".dock"), (text) => {
  // The new-session composer's pickers decide the harness, model, workspace, where it runs and its mode.
  const c = $("#composer"), get = (k, d) => c.getAttribute(k) || d;
  const harness = get("harness", "copilot"), model = P.model(get("model", P.defaultModel(harness)), harness);
  const env = get("environment", "local") === "cloud" ? "Cloud" : get("isolation", "branch") === "worktree" ? "Worktree" : "Local";
  const ws = workspaceFor(get("workspace", "vscode"));
  const id = "n" + state.seq++;
  state.sessions.unshift({
    id, state: "working", unread: false, time: "now", day: "Today", title: text.length > 64 ? text.slice(0, 62) + "…" : text,
    harness, model: model.name, workspace: ws, env,
    mode: get("mode"), permissions: get("permissions"), approvals: get("approvals"), agentMode: get("agent-mode"),
    branch: "agents/" + text.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 28).replace(/-$/, ""), prompt: text, preview: "Planning…",
    steps: [["Understand the task and explore the codebase", "active"], ["Make the change", "todo"], ["Run tests and hygiene", "todo"]], files: [],
  });
  // Only the counts update; the visible list, open row and focus stay as they are.
  renderTabs(); toast("Session started. It'll land in Ready for you when it's done.");
});

// Picker choices in a session's composer stick to that session (its composer is rebuilt after each reply).
document.addEventListener("change", (e) => {
  const input = e.target.localName === "vsc-chat-input" ? e.target : null;
  const s = input?.dataset.session && state.sessions.find(x => x.id === input.dataset.session);
  if (!s) return;
  const d = e.detail || {};
  if (d.model) s.model = P.model(d.model, s.harness)?.name ?? s.model;
  if (d.mode) s.mode = d.mode;
  if (d.permissions) s.permissions = d.permissions;
  if (d.approvals) s.approvals = d.approvals;
  if (d["agent-mode"]) s.agentMode = d["agent-mode"];
});

document.addEventListener("keydown", (e) => {
  if (lightbox) return;
  if (e.target.closest("input, textarea, [contenteditable], vsc-chat-question-carousel, vsc-action-list, vsc-chat-model-list, .vc") || e.metaKey || e.ctrlKey || e.altKey) { if (e.key === "Escape") e.target.blur?.(); return; }
  // In a full session, Escape goes back to the inbox; the inbox shortcuts don't apply.
  if (state.view) { if (e.key === "Escape") { e.preventDefault(); closeSession(); } return; }
  const list = visible(), i = list.findIndex(s => s.id === state.cur), s = list[i];
  const move = (n) => { if (!n) return; state.cur = n.id; if (state.open) { state.open = n.id; if (n.unread && n.state !== "working") n.unread = false; } render(); $(`.row[data-id="${n.id}"]`)?.scrollIntoView({ block: "nearest" }); };
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); move(list[i + 1]); }
  else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); move(list[i - 1]); }
  else if ((e.key === "Enter" || e.key === "o") && s) toggle(s.id);
  else if (e.key === "e" && s) act(s, "done");
  else if (e.key === "u" && s && s.state !== "done") act(s, "unread");
  else if ((e.key === "Delete" || e.key === "Backspace") && s && s.state === "done") { e.preventDefault(); act(s, "delete"); }
  else if (e.key === "h" && s && s.state !== "done" && !s.merging) act(s, "hold");
  else if (e.key === "m" && s && (s.merging || s.state === "review")) act(s, "merge");
  else if (e.key === "c") { e.preventDefault(); $("#composer .dt-editor-text")?.focus(); }
  else if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
  else if (visibleTabs()[+e.key - 1] && /^[1-5]$/.test(e.key)) setTab(visibleTabs()[+e.key - 1].id);
});

render();
</script>
<script type="module">
// Side panel: the Agents window's docked editor part hosting the real Customizations editor.
const C = window.PANEL_CONFIG;
const panel = document.getElementById("side-panel");
const part = document.getElementById("editor-part");
const cust = document.getElementById("cust");
const toggle = document.getElementById("toggle-panel");
let tabs = C.tabs.slice();
const setTabs = (active) => {
  part.setAttribute("tabs", tabs.join(","));
  part.setAttribute("active", active);
  cust.style.display = active === "Customizations" ? "" : "none";
};
setTabs(C.active);
setPanel(C.open);
part.addEventListener("tab-select", (e) => setTabs(e.detail.label));
part.addEventListener("tab-close", (e) => {
  tabs = tabs.filter((t) => t !== e.detail.label);
  if (!tabs.length) { setPanel(false); tabs = C.tabs.slice(); setTabs(C.active); return; }
  setTabs(part.getAttribute("active") === e.detail.label ? tabs[tabs.length - 1] : part.getAttribute("active"));
});
function setPanel(open) {
  panel.hidden = !open;
  toggle.setAttribute("icon", open ? "layout-sidebar-right" : "layout-sidebar-right-off");
  toggle.toggleAttribute("checked", open);
}
toggle.addEventListener("click", () => {
  const open = panel.hidden;
  if (open && !tabs.includes("Customizations")) tabs.push("Customizations");
  setPanel(open);
  if (open) setTabs(part.getAttribute("active") || "Customizations");
});
document.addEventListener("keydown", (e) => { if (e.altKey && e.metaKey && e.code === "KeyB") { e.preventDefault(); toggle.click(); } });

// Browse search filters the marketplace cards by name, description or type.
cust.addEventListener("search", (e) => {
  const q = e.detail.query.trim().toLowerCase();
  for (const section of cust.querySelectorAll("vsc-customization-discovery-section")) {
    let any = false;
    for (const card of section.querySelectorAll("vsc-customization-discovery-card")) {
      const hit = !q || ["name", "description", "meta"].some((a) => (card.getAttribute(a) || "").toLowerCase().includes(q));
      card.style.display = hit ? "" : "none";
      any ||= hit;
    }
    section.style.display = any ? "" : "none";
  }
});

// Drag the sash to resize the panel (the content pane keeps its 400px minimum, as in the product).
const sash = document.getElementById("panel-sash");
sash.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  sash.setPointerCapture(e.pointerId);
  sash.classList.add("active");
  const startX = e.clientX, startW = panel.offsetWidth;
  const min = Number(cust.getAttribute("sidebar-width")) + 400, max = Math.max(min, window.innerWidth - 520);
  const move = (ev) => { panel.style.width = Math.min(max, Math.max(min, startW + (startX - ev.clientX))) + "px"; };
  const up = () => { sash.classList.remove("active"); sash.removeEventListener("pointermove", move); sash.removeEventListener("pointerup", up); };
  sash.addEventListener("pointermove", move);
  sash.addEventListener("pointerup", up);
});
</script>
