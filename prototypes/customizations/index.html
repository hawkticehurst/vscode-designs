<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Customizations — Docked side panel</title>
<link rel="stylesheet" href="../../systems/vscode/system.css" />
<script type="module" src="../../systems/vscode/system.js"></script>
<script src="customizations.js"></script>
<script src="panel-config.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #121314; overflow: hidden; }
  #wb {
    /* Toast insets, as the Agents window sets them (src/vs/sessions/browser/media/workbench.css), widened to 16px so toasts clear the floating panel edge. */
    --modern-ui-notifications-inline-inset: var(--vscode-spacing-size160);
    --modern-ui-notifications-block-end-inset: var(--vscode-spacing-size160); position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column;
        background: var(--vscode-agents-background); color: var(--vscode-foreground); font-size: var(--vscode-agents-fontSize-body1); }
  .tb button { font: inherit; color: inherit; }
  /* border-box only on prototype-owned elements: VS Code widgets rely on content-box */
  :is(.tb) :is(.cc, .avatar) { box-sizing: border-box; }
  .grow { flex: 1; }

  .tb { height: 38px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; }
  .tb-center { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; }
  /* Session pill, after src/vs/sessions/contrib/sessions/browser/media/sessionsTitleBarWidget.css. */
  .cc { width: 31vw; max-width: 600px; height: 22px; display: flex; align-items: center; border-radius: var(--vscode-cornerRadius-medium); cursor: pointer;
        border: 1px solid var(--vscode-commandCenter-border); background: transparent; color: var(--vscode-commandCenter-foreground); }
  .cc:hover { background: var(--vscode-commandCenter-activeBackground); }
  .cc-pill { display: flex; align-items: center; gap: 6px; padding: 0 8px; min-width: 0; opacity: 0.6; }
  .cc-pill .codicon { font-size: var(--vscode-codiconFontSize-compact, 14px) !important; }
  .cc-label { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .avatar { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 600; flex: none;
            background: var(--vscode-chat-avatarBackground); color: var(--vscode-chat-avatarForeground); border: 1px solid var(--vscode-agentsCard-border); }
  .avatar-photo { padding: 0; overflow: hidden; cursor: pointer; }
  .avatar-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Agents window parts row: the sessions part and the docked editor part (src/vs/sessions layout), 2px apart. */
  .parts { flex: 1; min-height: 0; display: flex; margin: 0 4px 4px; }
  .side-panel { position: relative; flex: none; height: 100%; margin-left: 2px; }
  .side-panel[hidden] { display: none; }
  .side-panel vsc-agents-editor-part { height: 100%; }
  .side-panel .empty-editor { height: 100%; }
  /* The workbench grid's sash between the sessions part and the docked editor part, centered on the 2px gap. */
  #panel-sash { left: calc(-1px - var(--vscode-sash-size) / 2); }
  /* Exploration: no card around the Customizations content. The product draws each page (Browse, lists, item editor)
     as a rounded agentsPanel card inset 8px from the editor; here the page sits directly on the editor background,
     keeping its inner spacing. */
  #side-panel .ai-customization-management-editor .content-inner { padding-right: 0; padding-bottom: 0; }
  /* Section list: inset from the tab bar instead of touching it. */
  #side-panel .ai-customization-management-editor .sidebar-content { padding-top: var(--vscode-spacing-size80); padding-left: var(--vscode-spacing-size80); padding-right: 0; }
  /* The product puts the separator gap inside the Extensions row (padding-top 12px), so its hover/selection background
     covers the divider. Move the gap outside the row (a regular 26px row, 8px lower) and draw the divider in the gap. */
  #side-panel .ai-customization-management-editor .section-list-item.section-separator-before { margin-top: var(--vscode-spacing-size80); height: 26px !important; padding-top: var(--vscode-spacing-size40); overflow: visible; }
  #side-panel .ai-customization-management-editor .section-list-item.section-separator-before::before { top: calc(-1 * var(--vscode-spacing-size40)); }
  /* Tighter page insets in the side panel: the product's 40px (spacing-size400) top and side insets become 8px on top,
     so the page's title row lines up with the Browse tab, and 8px on the sides, matching the section list's 8px
     inset from the panel edge; with no right padding on the section list, sidebar and content are 8px apart too. */
  #side-panel .ai-customization-management-editor { --cust-inset: var(--vscode-spacing-size80); }
  #side-panel .ai-customization-management-editor .content-inner .welcome-page-host,
  #side-panel .ai-customization-management-editor :is(.prompts-content-container, .mcp-content-container, .plugin-content-container, .tools-content-container) {
    padding-top: var(--vscode-spacing-size80); padding-inline: 0;
  }
  #side-panel .ai-customization-management-editor :is(.customization-discovery-header, .customization-discovery-browse, .customization-discovery-results),
  #side-panel .ai-customization-management-editor :is(.ai-customization-list-widget, .plugin-list-widget) > :is(.section-title-header, .plugin-marketplace-back-container, .list-search-and-button-container, .list-container, .mcp-list-container),
  #side-panel .ai-customization-management-editor .tools-list-widget > :is(.section-title-header, .tools-list-search-and-button-container, .tools-list-tree),
  #side-panel .ai-customization-management-editor .agents-window-extensions > :is(.agents-window-extensions-header, .agents-window-extensions-search, .agents-window-extensions-tree, .agents-window-extensions-empty) {
    width: min(calc(100% - 2 * var(--cust-inset)), 840px);
  }
  /* Frame the docked part like the sessions part (.page): 1px agentsPanel border, large radius. */
  #side-panel .part.editor { border: 1px solid var(--vscode-agentsPanel-border); border-radius: var(--vscode-cornerRadius-large); overflow: hidden; box-sizing: border-box; }
  #side-panel .ai-customization-management-editor :is(.welcome-page-host, .prompts-content-container, .mcp-content-container,
    .plugin-content-container, .tools-content-container, .editor-content-container) {
    background: transparent; border: 0; border-radius: 0;
  }
  .page { flex: 1; min-width: 0; min-height: 0; margin: 0; border-radius: var(--vscode-cornerRadius-large); overflow-y: auto;
          background: var(--vscode-agentsPanel-background); color: var(--vscode-agentsPanel-foreground); border: 1px solid var(--vscode-agentsPanel-border); }
  /* Home: the Agents window's new-session view. Welcome message centered above the new-session composer, both centered
     in the sessions part (src/vs/sessions/contrib/chat/browser/media/chatWidget.css; these container and welcome rules
     aren't in the design system's captures). */
  .page > vsc-session-view { height: 100%; }
  .page .session-view, .page .session-view-content, .page .chat-view-new, .page .sessions-chat-widget { height: 100%; }
  .page .sessions-chat-widget { display: flex; flex-direction: column; width: 100%; position: relative; }
  .page .new-chat-widget-container { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%;
    box-sizing: border-box; overflow: hidden; padding: var(--vscode-spacing-size160) var(--vscode-spacing-size160) var(--vscode-spacing-size200); position: relative; }
  .page .new-chat-widget-container > vsc-chat-input { width: 100%; max-width: 800px; }
  .new-session-welcome-message { align-self: center; align-items: center; display: flex; gap: var(--vscode-spacing-size40); justify-content: center;
    margin-bottom: var(--vscode-spacing-size160); position: relative; text-align: center; }
  .new-session-welcome-message-title { color: var(--vscode-foreground); font-size: var(--vscode-fontSize-heading1); font-weight: 400; line-height: 1.4; margin: 0; }

  /* Row actions: switch, then the ⋯ menu on the far right, always visible (the product reveals ⋯ on hover). */
  .ai-customization-list-item .item-right { opacity: 1 !important; }

  /* ---- Phone (≤ 640px) ---- */
  @media (max-width: 640px) {
    /* Title bar: sidebar toggle, session pill (fills the space) and avatar. Navigation, run and layout actions are desktop-only. */
    .tb { gap: 6px; padding: 0 8px; }
    .tb-center { position: static; transform: none; flex: 1; min-width: 0; }
    .tb-center + .grow { display: none; }
    .tb-nav, .tb-run, .tb-layout { display: none; }
    .cc { width: auto; flex: 1; min-width: 0; }
    .side-panel { display: none; }
  }
</style>
</head>
<body>
<vsc-workbench id="wb" theme="dark-2026" window="agents" class="nostatusbar">
  <header class="tb">
    <vsc-toolbar label="Window"><vsc-action icon="layout-sidebar-left-off" label="Show Sessions Sidebar"></vsc-action></vsc-toolbar>
    <div class="tb-center">
      <vsc-toolbar class="tb-nav" label="Session Navigation"><vsc-action icon="arrow-left" label="Go Back" id="nav-back"></vsc-action><vsc-action icon="arrow-right" label="Go Forward" id="nav-fwd" disabled></vsc-action></vsc-toolbar>
      <div class="cc" role="button" tabindex="0" aria-label="Show Sessions: No workspace"><div class="cc-pill"><span class="codicon codicon-comment-discussion" aria-hidden="true"></span><span class="cc-label">No workspace</span></div></div>
      <vsc-toolbar class="tb-run" label="Session Actions"><vsc-action icon="play" label="Run" disabled></vsc-action><vsc-action icon="vscode-insiders" label="Open in VS Code - Insiders"></vsc-action></vsc-toolbar>
    </div>
    <div class="grow"></div>
    <vsc-toolbar class="tb-layout" label="Layout">
      <vsc-action icon="layout-panel-off" label="Show Panel (⌘J)"></vsc-action>
      <vsc-action icon="layout-sidebar-right" label="Toggle Side Panel (⌥⌘B)" id="toggle-panel" checked></vsc-action>
      <vsc-action icon="radio-tower" label="Remote Access"></vsc-action>
    </vsc-toolbar>
    <button class="avatar avatar-photo" title="hawkticehurst" aria-label="Accounts: hawkticehurst"><img src="assets/profile.jpg" alt="" /></button>
  </header>
  <div class="parts">
  <main class="page" id="page">
    <vsc-session-view variant="new">
      <div class="new-session-welcome-message"><h2 class="new-session-welcome-message-title" id="greet">Good morning, Hawk</h2></div>
      <vsc-chat-input id="composer" variant="new-session" placeholder="What should agents work on?" workspace="vscode" isolation="worktree"></vsc-chat-input>
    </vsc-session-view>
  </main>
  <aside class="side-panel" id="side-panel" aria-label="Side Panel">
    <div class="monaco-sash mac vertical" id="panel-sash" role="separator" aria-orientation="vertical" aria-label="Resize Side Panel"></div>
    <vsc-agents-editor-part id="editor-part" tabs="Changes,Files,Customizations" active="Customizations">
      <vsc-customizations-editor id="cust" section="browse" style="height: 100%;"></vsc-customizations-editor>
    </vsc-agents-editor-part>
  </aside>
  <script>
    // Runs while the page parses, before system.js upgrades the elements (they read their slotted children once).
    (function () {
      const C = window.PANEL_CONFIG, cust = document.getElementById("cust"), part = document.getElementById("editor-part"), panel = document.getElementById("side-panel");
      cust.setAttribute("sidebar-width", String(C.sidebarWidth));
      cust.setAttribute("section", new URLSearchParams(location.search).get("section") || C.section);
      window.renderCustomizationsEditor(cust);
      part.setAttribute("tabs", C.tabs.join(","));
      part.setAttribute("active", C.active);
      panel.style.width = C.width + "px";
      panel.hidden = !C.open;
    })();
  </script>
  <script>
    // The welcome phrase follows the time of day.
    (function () {
      const h = new Date().getHours();
      document.getElementById("greet").textContent = `Good ${h < 12 ? "morning" : h < 18 ? "afternoon" : "evening"}, Hawk`;
    })();
  </script>
  </div>
</vsc-workbench>

<script type="module">
// Side panel: the Agents window's docked editor part hosting the real Customizations editor.
const C = window.PANEL_CONFIG;
const panel = document.getElementById("side-panel");
const part = document.getElementById("editor-part");
const cust = document.getElementById("cust");
const toggle = document.getElementById("toggle-panel");
let tabs = C.tabs.slice();
const setTabs = (active) => {
  part.setAttribute("tabs", tabs.join(","));
  part.setAttribute("active", active);
  cust.style.display = active === "Customizations" ? "" : "none";
};
setTabs(C.active);
setPanel(C.open);
part.addEventListener("tab-select", (e) => setTabs(e.detail.label));
part.addEventListener("tab-close", (e) => {
  tabs = tabs.filter((t) => t !== e.detail.label);
  if (!tabs.length) { setPanel(false); tabs = C.tabs.slice(); setTabs(C.active); return; }
  setTabs(part.getAttribute("active") === e.detail.label ? tabs[tabs.length - 1] : part.getAttribute("active"));
});
function setPanel(open) {
  panel.hidden = !open;
  toggle.setAttribute("icon", open ? "layout-sidebar-right" : "layout-sidebar-right-off");
  toggle.toggleAttribute("checked", open);
}
toggle.addEventListener("click", () => {
  const open = panel.hidden;
  if (open && !tabs.includes("Customizations")) tabs.push("Customizations");
  setPanel(open);
  if (open) setTabs(part.getAttribute("active") || "Customizations");
});
document.addEventListener("keydown", (e) => { if (e.altKey && e.metaKey && e.code === "KeyB") { e.preventDefault(); toggle.click(); } });

// Browse search filters the marketplace cards by name, description or type.
cust.addEventListener("search", (e) => {
  const q = e.detail.query.trim().toLowerCase();
  for (const section of cust.querySelectorAll("vsc-customization-discovery-section")) {
    let any = false;
    for (const card of section.querySelectorAll("vsc-customization-discovery-card")) {
      const hit = !q || ["name", "description", "meta"].some((a) => (card.getAttribute(a) || "").toLowerCase().includes(q));
      card.style.display = hit ? "" : "none";
      any ||= hit;
    }
    section.style.display = any ? "" : "none";
  }
});

// Resizable panels. The part sash resizes the docked editor part (min: the Customizations editor's 150px sidebar
// + 400px content; the sessions part keeps 520px); double-click resets it to the default. The section sash inside the
// editor is the component's own (150–350px sidebar, double-click resets to 200px) and gives way when the part narrows.
const PART_MIN = 150 + 400, SESSIONS_MIN = 520;
const partMax = () => Math.max(PART_MIN, document.querySelector(".parts").clientWidth - SESSIONS_MIN - 2);
const setPartWidth = (w) => {
  const width = Math.round(Math.min(partMax(), Math.max(PART_MIN, w)));
  panel.style.width = width + "px";
  sash.classList.toggle("minimum", width <= PART_MIN);
  sash.classList.toggle("maximum", width >= partMax());
};
const sash = document.getElementById("panel-sash");
let startWidth = 0;
window.ds.vscode.sash(sash, {
  start: () => { startWidth = panel.offsetWidth; },
  move: (dx) => setPartWidth(startWidth - dx),
  reset: () => setPartWidth(C.width),
});
setPartWidth(C.width);
window.addEventListener("resize", () => setPartWidth(panel.offsetWidth));
</script>
</body>
</html>
