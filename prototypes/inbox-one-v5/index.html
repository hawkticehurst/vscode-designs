<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inbox One — Inbox sidebar + Summary / Chat toggle</title>
<link rel="stylesheet" href="../../systems/vscode/system.css" />
<script type="module" src="../../systems/vscode/system.js"></script>
<script src="data.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #121314; overflow: hidden; }
  #wb {
    /* Toast insets, as the Agents window sets them (src/vs/sessions/browser/media/workbench.css), widened to 16px so toasts clear the floating panel edge. */
    --modern-ui-notifications-inline-inset: var(--vscode-spacing-size160);
    --modern-ui-notifications-block-end-inset: var(--vscode-spacing-size160); position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column;
        background: var(--vscode-agents-background); color: var(--vscode-foreground); font-size: var(--vscode-agents-fontSize-body1); }
  #wb button { font: inherit; color: inherit; }
  /* border-box only on prototype-owned elements: VS Code widgets rely on content-box */
  :is(.cc, .avatar, .tag, .si, .sb, .dock) { box-sizing: border-box; }
  .muted { color: var(--vscode-descriptionForeground); }
  .grow { flex: 1; }
  code, .mono { font-family: var(--monaco-monospace-font, ui-monospace, "SF Mono", Menlo, Consolas, monospace); font-size: 12px; }
  code { padding: 1px 4px; border-radius: var(--vscode-cornerRadius-small); background: var(--vscode-textPreformat-background); }

  .tb { height: 38px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; }
  .tb-center { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; }
  /* Session pill, after src/vs/sessions/contrib/sessions/browser/media/sessionsTitleBarWidget.css. */
  .cc { width: 31vw; max-width: 600px; height: 22px; display: flex; align-items: center; border-radius: var(--vscode-cornerRadius-medium); cursor: pointer;
        border: 1px solid var(--vscode-commandCenter-border); background: transparent; color: var(--vscode-commandCenter-foreground); }
  .cc:hover { background: var(--vscode-commandCenter-activeBackground); }
  .cc-pill { display: flex; align-items: center; gap: 6px; padding: 0 8px; min-width: 0; opacity: 0.6; }
  .cc-pill .codicon { font-size: var(--vscode-codiconFontSize-compact, 14px) !important; }
  .cc-label { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .avatar { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 600; flex: none;
            background: var(--vscode-chat-avatarBackground); color: var(--vscode-chat-avatarForeground); border: 1px solid var(--vscode-agentsCard-border); }
  .avatar-photo { padding: 0; overflow: hidden; cursor: pointer; }
  .avatar-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* The chat view container: the floating panel beside the sessions sidebar. */
  .page { flex: 1; min-width: 0; min-height: 0; margin: 0 6px 6px; border-radius: var(--vscode-cornerRadius-large); overflow-y: auto;
          background: var(--vscode-agentsPanel-background); color: var(--vscode-agentsPanel-foreground); border: 1px solid var(--vscode-agentsPanel-border); }
  .body:not(.sb-off) .page { margin-left: 0; }
  /* No session selected: the Agents window's new-session view, greeting above the composer. */
  #home { min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 24px 0 12vh; }
  .greet { margin: 0 0 16px; text-align: center; font-size: var(--vscode-agents-fontSize-heading1); font-weight: 400; letter-spacing: -0.015em; }
  .dock { width: 100%; }
  .dock vsc-session-view { max-width: 800px; margin: 0 auto; padding-inline: 16px; }
  /* ---- Sessions sidebar in Inbox presentation, after microsoft/vscode hawkticehurst/agent-window-inbox-and-threads
     (src/vs/sessions/contrib/sessions/browser/media/sessionsViewPane.css and sessionsList.css): a flat list of sessions
     that need you, with Running / On Hold / Ready to Merge anchored in collapsed sections below it. ---- */
  .body { flex: 1; min-height: 0; display: flex; position: relative; }
  .sb { width: 300px; flex: none; min-height: 0; display: flex; flex-direction: column; padding-bottom: 6px; color: var(--vscode-sideBar-foreground, var(--vscode-foreground)); }
  .body.sb-off .sb { display: none; }
  .sb-head { height: 32px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 14px; user-select: none; -webkit-user-select: none; }
  .sb-label { flex: 1; min-width: 0; font-size: var(--vscode-fontSize-label1, 12px); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sb-find { flex: 1; min-width: 0; height: 24px; display: flex; align-items: center; padding: 0 6px; border-radius: var(--vscode-cornerRadius-medium);
             background: var(--vscode-input-background); border: 1px solid var(--vscode-input-border, transparent); color: var(--vscode-input-foreground); }
  .sb-find:focus-within { border-color: var(--vscode-focusBorder); }
  .sb-find input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: inherit; font: inherit; font-size: 12px; }
  .sb-find input::placeholder { color: var(--vscode-input-placeholderForeground); }
  .sb-empty { padding: 0 12px 8px 14px; color: var(--vscode-descriptionForeground); font-size: 12px; line-height: 1.4em; }
  .sb-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 4px; }
  .sb-bottom { flex: 0 1 auto; max-height: 50%; overflow-y: auto; padding-top: 4px; }

  /* Session rows: status icon, then the title row and a details row (harness, workspace, diff, time). */
  .si { position: relative; display: flex; padding: 8px 6px 8px 12px; margin-bottom: 2px; border-radius: var(--vscode-cornerRadius-small); cursor: pointer; outline: none; }
  .si:hover { background: var(--vscode-list-hoverBackground); }
  .si.selected { background: var(--vscode-list-inactiveSelectionBackground); }
  .si.cur:not(.selected)::before { content: ""; position: absolute; inset: 0; border: 1px solid var(--vscode-focusBorder); border-radius: inherit; pointer-events: none; }
  .si-icon { display: flex; align-items: flex-start; line-height: 17px; }
  .si-icon > span { display: flex; height: 17px; align-items: center; }
  .si-main { flex: 1; min-width: 0; padding-left: 6px; }
  .si-title-row { display: flex; align-items: center; gap: 4px; height: 17px; line-height: 17px; padding-bottom: 4px; }
  .si-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .si-actions { display: none; flex: none; margin-right: -2px; }
  .si:is(:hover, :focus-within) .si-actions { display: flex; }
  .si-details { display: flex; align-items: center; gap: 4px; font-size: var(--vscode-agents-fontSize-label2, 11px); line-height: 15px; max-height: 15px; overflow: hidden; color: var(--vscode-descriptionForeground); }
  .si-details .codicon { font-size: var(--vscode-codiconFontSize-compact, 12px) !important; }
  .si-details > span:has(> .codicon) { display: flex; align-items: center; }
  .si-ws { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .si-diff { display: flex; gap: 2px; font-variant-numeric: tabular-nums; }
  .si-sep::before { content: "\00B7"; }

  /* Anchored sections below the Inbox list (collapsed by default; the chevron shows on hover). */
  .bs { padding: 0 4px 4px; }
  .bs-head { display: flex; align-items: center; min-height: 28px; padding: 0 8px; border-radius: var(--vscode-cornerRadius-small); color: var(--vscode-descriptionForeground); cursor: pointer; outline: none; user-select: none; -webkit-user-select: none; }
  .bs-head:hover { background: var(--vscode-list-hoverBackground); }
  .bs-head:focus-visible { outline: 1px solid var(--vscode-focusBorder); outline-offset: -1px; }
  .bs-icon { display: flex; align-items: center; margin-right: 6px; }
  .bs-label { flex: 1; min-width: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bs-chev { display: flex; margin-left: 4px; opacity: 0; }
  .bs-chev .codicon { font-size: 14px !important; }
  .bs-head:is(:hover, :focus-visible) .bs-chev { opacity: 1; }
  .bs-list { padding-top: 2px; }
  @media not (prefers-reduced-motion: reduce) {
    .bs-running .bs-label {
      background: linear-gradient(90deg, var(--vscode-descriptionForeground) 0%, var(--vscode-descriptionForeground) 30%, var(--vscode-chat-thinkingShimmer) 50%, var(--vscode-descriptionForeground) 70%, var(--vscode-descriptionForeground) 100%);
      background-size: 400% 100%; background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: bs-shimmer 6s steps(90, jump-none) infinite;
    }
  }
  @keyframes bs-shimmer { 0% { background-position: 120% 0; } 50%, 100% { background-position: -120% 0; } }

  .tag { height: 18px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: var(--vscode-cornerRadius-small); font-size: var(--vscode-agents-fontSize-label2);
         border: 1px solid var(--vscode-agentsCard-border); color: var(--vscode-descriptionForeground); white-space: nowrap; }
  .tag .codicon { font-size: 12px !important; }
  .tag > span:has(> .codicon) { display: inline-flex; align-items: center; }
  .st-input, .tag.st-input { color: var(--vscode-list-warningForeground); }
  .st-working, .tag.st-working { color: var(--vscode-textLink-foreground); }
  .st-error, .tag.st-error { color: var(--vscode-errorForeground); }
  .st-done, .tag.st-done { color: var(--vscode-testing-iconPassed); }
  .st-unread { color: var(--vscode-textLink-foreground); }
  .st-read { color: var(--vscode-agentSessionReadIndicator-foreground); }
  .add { color: var(--vscode-chat-linesAddedForeground); } .del { color: var(--vscode-chat-linesRemovedForeground); }
  .pr-open { color: var(--vscode-charts-green); } .pr-merged { color: var(--vscode-charts-purple); }
  :is(.st-input, .st-working, .st-error, .st-done, .st-unread, .st-read, .add, .del, .pr-open, .pr-merged) .codicon { color: inherit !important; }

  .steps { margin: 2px 0 10px; display: grid; gap: 4px; }
  .step { display: flex; align-items: center; gap: 8px; }
  .step.todo { color: var(--vscode-descriptionForeground); }

  /* ---- Summary: the chat view container's alternate rendering of a session (the summarized artifacts from V4) ---- */
  .s-sum { flex: 1; box-sizing: border-box; width: 100%; max-width: 800px; margin: 0 auto; padding: 4px 16px 16px; line-height: 1.55; }
  .s-sum p { margin: 0 0 8px; }
  .sum-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; margin: 4px 0 14px; font-size: 12px; line-height: 18px; color: var(--vscode-descriptionForeground); }
  .sum-meta > span { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
  .sum-meta .codicon { font-size: 14px !important; color: inherit !important; }
  .sum-meta code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sum-task { margin: 0 0 18px; padding: 2px 0 2px 12px; border-left: 2px solid var(--vscode-textBlockQuote-border); color: var(--vscode-descriptionForeground); }
  .sum-task b { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .sum-h { margin: 20px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--vscode-descriptionForeground); }
  .sum-h:first-of-type { margin-top: 0; }
  .s-sum .vc { max-width: none; margin: 0 0 12px; }
  /* Artifact cards share the visual-changes card's chrome. */
  .arts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .art { box-sizing: border-box; min-width: 0; border: 1px solid var(--vscode-widget-border, var(--vscode-panel-border)); border-radius: var(--vscode-cornerRadius-large, 8px);
         background: var(--vscode-editorWidget-background); overflow: hidden; line-height: normal; }
  .art.wide { grid-column: 1 / -1; }
  .art-head { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 4px 12px; font-weight: 600; }
  .art-head .muted { font-weight: 400; font-size: 12px; }
  .art-row { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 12px; border-top: 1px solid var(--vscode-widget-border, var(--vscode-panel-border)); font-size: 12px; }
  .art-row > span:has(> .codicon) { display: flex; }
  .art-row .codicon { font-size: 14px !important; }
  .art-path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .art-path .dir { color: var(--vscode-descriptionForeground); }
  .art-num { flex: none; display: flex; gap: 4px; font-variant-numeric: tabular-nums; }
  .art-pr { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .art-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--vscode-widget-border, var(--vscode-panel-border)); }
  .art-foot vsc-button { flex: none; width: auto; min-width: 80px; padding: 4px 12px; }
  /* The Summary | Chat toggle in the session title bar. */
  .s-mode { flex: none; }

  /* Visual changes: before/after screenshots the agent captured, with a side-by-side or swipe comparison and the session's decision. */
  /* Border-box so its 760px cap matches the reply composer's outer edge exactly. */
  .vc { container-type: inline-size; box-sizing: border-box; max-width: 760px; margin: 4px 0 12px; border: 1px solid var(--vscode-widget-border, var(--vscode-panel-border)); border-radius: var(--vscode-cornerRadius-large, 8px);
        background: var(--vscode-editorWidget-background); overflow: hidden; line-height: normal; }
  .vc-head { display: flex; flex-wrap: nowrap; align-items: center; gap: 2px 8px; min-height: 36px; box-sizing: border-box; padding: 4px 4px 4px 12px; }
  /* The toolbar keeps the title's line; a long question wraps instead. */
  .vc-title { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 600; line-height: 18px; }
  .vc-title .codicon { flex: none; }
  .vc-title:has(.codicon-report-question) .codicon { color: var(--vscode-list-warningForeground) !important; }
  .vc-tools { flex: none; margin-left: auto; }
  .vc-sep { width: 1px; height: 16px; margin: 0 4px; align-self: center; background: var(--vscode-widget-border, var(--vscode-panel-border)); }
  /* Option tabs: the inbox's pill tabs, sized down to sit in the After label. */
  /* Same height whether or not the label holds option tabs, so side-by-side screenshots start on the same line. */
  .vc-lab { display: flex; align-items: center; gap: 6px; min-width: 0; height: 32px; }
  .vc-lab vsc-view-tabs { min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .vc-lab vsc-view-tabs .composite.title { width: max-content; }
  .vc-body { display: grid; gap: 12px; padding: 0 12px 12px; }
  .vc-body.split:not(.stack) { grid-template-columns: 1fr 1fr; }
  /* Narrow cards: portrait shots stay side by side (small, but comparable at a glance; Expand for detail), the option tabs
     become a dropdown in the After label, and the labels drop their branch chips. */
  .vc-lab vsc-select { display: none; }
  .vc-lab vsc-select { position: relative; }
  .vc-lab vsc-select select { appearance: none; width: 100%; height: 24px; padding: 0 22px 0 6px; border: 1px solid; border-radius: var(--vscode-cornerRadius-small); font: inherit; font-size: 12px; text-overflow: ellipsis; }
  /* A chevron so it reads as a dropdown (codicon chevron-down). */
  .vc-lab vsc-select::after { content: "\eab4"; position: absolute; right: 5px; top: 50%; translate: 0 -50%; font: 14px/1 codicon; color: var(--vscode-dropdown-foreground); pointer-events: none; }
  @container (max-width: 480px) {
    .vc-body.split:not(.stack) { gap: 8px; }
    .vc-lab vsc-view-tabs, .vc-lab code { display: none; }
    .vc-lab vsc-select { display: block; flex: 1; min-width: 0; max-width: 180px; }
  }
  .vc-pane { margin: 0; display: grid; gap: 6px; min-width: 0; }
  .vc-pane figcaption { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; line-height: 16px; color: var(--vscode-descriptionForeground); }
  .vc-pane figcaption b { font-weight: 600; color: var(--vscode-foreground); }
  .vc-pane figcaption code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vc-shot { position: relative; line-height: 0; border: 1px solid var(--vscode-widget-border, var(--vscode-panel-border)); border-radius: var(--vscode-cornerRadius-medium); }
  .vc-shot img { display: block; width: 100%; height: auto; border-radius: calc(var(--vscode-cornerRadius-medium) - 1px); }
  /* Swipe: the after image sits over the before image and is clipped at the handle. */
  .vc-swipe { --pos: 50%; position: relative; line-height: 0; cursor: ew-resize; touch-action: none; user-select: none; -webkit-user-select: none;
              border: 1px solid var(--vscode-widget-border, var(--vscode-panel-border)); border-radius: var(--vscode-cornerRadius-medium); overflow: hidden; }
  .vc-swipe img { display: block; width: 100%; height: auto; pointer-events: none; }
  .vc-swipe img.after { position: absolute; inset: 0; clip-path: inset(0 0 0 var(--pos)); }
  /* Swipe labels sit above the image so they never cover the change. */
  .vc-swipe-cap { justify-content: space-between; gap: 12px; }
  .vc-handle { position: absolute; z-index: 2; top: 0; bottom: 0; left: var(--pos); width: 2px; translate: -1px 0; background: var(--vscode-focusBorder); outline: none; }
  .vc-handle .grip { position: absolute; top: 50%; left: 50%; translate: -50% -50%; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
                     background: var(--vscode-editorWidget-background); border: 1px solid var(--vscode-focusBorder); color: var(--vscode-foreground); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); }
  .vc-handle .grip .codicon { font-size: 14px !important; }
  .vc-handle:focus-visible .grip { outline: 2px solid var(--vscode-focusBorder); outline-offset: 1px; }
  .vc-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--vscode-widget-border, var(--vscode-panel-border)); }
  .vc-hint { flex: 1 1 auto; display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--vscode-descriptionForeground); font-size: 12px; line-height: 16px; }
  .vc-hint .codicon { flex: none; font-size: 14px !important; color: inherit !important; }
  /* Dialog-style buttons: sized to their label, not the full width of a .monaco-text-button. */
  /* Actions stay right-aligned, also when the hint wraps them onto their own line. */
  .vc-actions { display: flex; gap: 8px; margin-left: auto; }
  .vc-foot vsc-button { flex: none; width: auto; min-width: 80px; padding: 4px 12px; }
  /* Expanded comparison: a modal over the window with the same card, larger. */
  .vc-lightbox { position: fixed; inset: 0; z-index: 2500; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: rgba(0, 0, 0, 0.5); }
  .vc-lightbox .vc { width: min(1200px, 100%); max-width: none; max-height: 100%; margin: 0; overflow: auto; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); }
  .vc-lightbox .vc-body.split:not(.stack) { gap: 16px; }
  /* Anchored 4px above the composer, like the question card: inline before a reply, and in a session's composer area. */
  .s-ask .vc { max-width: none; margin: 0 0 8px; }
  /* In a session's transcript the card spans the chat column, the same width as the composer below. */
  .s-chat .vc { max-width: none; }
  /* The composer area stays compact: shots are capped in height and shrink to their own width (so the swipe overlay still lines up). */
  .s-ask .vc-shot, .s-ask .vc-swipe { width: fit-content; max-width: 100%; margin: 0 auto; }
  .s-ask :is(.vc-shot, .vc-swipe) img { width: auto; max-width: 100%; max-height: min(34vh, 320px); }
  .s-ask .vc-swipe img.after { width: 100%; height: 100%; }
  @media (max-width: 600px) { .vc-lightbox { padding: 8px; } }

  /* Full session: header, transcript and a composer pinned to the bottom of the panel. */
  #home[hidden], .session[hidden] { display: none; }
  .session { min-height: 100%; display: flex; flex-direction: column; }
  /* Session title bar: status, title and an overflow menu (navigation lives in the window title bar). */
  /* Same column as the transcript and composer: 800px max, with the chat items' 16px side padding. */
  .s-head { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; box-sizing: border-box; width: 100%; max-width: 800px; height: 40px;
            margin: 0 auto; padding: 0 16px; background: var(--vscode-agentsPanel-background); }
  .s-status { display: flex; }
  .s-head-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
  .s-head h2 { flex: 1; min-width: 0; margin: 0; font-size: 13px; font-weight: 400; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s-chat { flex: 1; width: 100%; max-width: 800px; margin: 0 auto; padding-bottom: 8px; }
  .s-chat vsc-chat-view, .s-composer vsc-chat-view { background: transparent; display: block; }
  .s-composer { position: sticky; bottom: 0; z-index: 2; width: 100%; max-width: 800px; margin: 0 auto; padding-bottom: 12px; background: var(--vscode-agentsPanel-background); }
  /* The session composer centers its input part; inset it 16px like the session header and transcript. */
  .s-composer vsc-session-view { --session-view-content-horizontal-padding: 16px; }
  /* A pending question sits just above the composer (like the product's chat input), not in the transcript. */
  /* The card's 8px bottom margin plus the input part's top padding would leave 12px; pull the composer up to a 4px gap. */
  .s-ask { margin: 0 16px -8px; }
  .s-ask:empty { display: none; }


  /* Menu item under the pointer (VS Code applies these selection colors from JS). */
  vsc-menu vsc-menu-item.focused > a.action-menu-item { background: var(--vscode-menu-selectionBackground); border-radius: var(--vscode-cornerRadius-medium); }
  vsc-menu vsc-menu-item.focused > a.action-menu-item, vsc-menu vsc-menu-item.focused > a.action-menu-item > span { color: var(--vscode-menu-selectionForeground) !important; }
  /* From vs/base/browser/ui/dialog/dialog.css (not part of the captured component CSS). */
  vsc-dialog.monaco-dialog-modal-block { position: fixed; height: 100%; width: 100%; left: 0; top: 0; z-index: 2575; display: flex; justify-content: center; align-items: center; }
  vsc-dialog.monaco-dialog-modal-block.dimmed { background: rgba(0, 0, 0, 0.5); }
  /* Narrow windows: the sidebar covers the chat view container; opening a session hides it again. */
  @media (max-width: 720px) {
    .sb { position: absolute; inset: 0; z-index: 10; width: auto; background: var(--vscode-agents-background); }
    .body .page { margin-left: 4px; }
  }

  /* ---- Phone (≤ 640px) ---- */
  @media (max-width: 640px) {
    /* Title bar: sidebar toggle, session pill (fills the space) and avatar. Navigation, run and layout actions are desktop-only. */
    .tb { gap: 6px; padding: 0 8px; }
    .tb-center { position: static; transform: none; flex: 1; min-width: 0; }
    .tb-center + .grow { display: none; }
    .tb-nav, .tb-run, .tb-layout { display: none; }
    .cc { width: auto; flex: 1; min-width: 0; }

    .body .page { margin: 0 4px 4px; }
    .greet { font-size: 22px; margin-bottom: 8px; }
    .dock vsc-session-view { padding-inline: 8px; }
    .s-head { flex-wrap: wrap; height: auto; min-height: 40px; padding: 4px 8px; }
    .s-sum { padding-inline: 10px; }
    .si-actions { display: none !important; }

    /* Toasts span the window width (as in the Agents window phone layout, src/vs/sessions/browser/media/phoneLayout.css). */
    #toasts { left: 8px; right: 8px; }
    #toasts .notifications-list-container { width: auto !important; }
    #toasts .notification-toast { width: auto; }
  }
</style>
</head>
<body>
<vsc-workbench id="wb" theme="dark-2026" window="agents" class="nostatusbar">
  <header class="tb">
    <vsc-toolbar label="Window"><vsc-action icon="layout-sidebar-left" label="Hide Sessions Sidebar (⌘B)" id="sb-toggle"></vsc-action></vsc-toolbar>
    <div class="tb-center">
      <vsc-toolbar class="tb-nav" label="Session Navigation"><vsc-action icon="arrow-left" label="Go Back" id="nav-back"></vsc-action><vsc-action icon="arrow-right" label="Go Forward" id="nav-fwd" disabled></vsc-action></vsc-toolbar>
      <div class="cc" role="button" tabindex="0" aria-label="Show Sessions: No workspace"><div class="cc-pill"><span class="codicon codicon-comment-discussion" aria-hidden="true"></span><span class="cc-label">No workspace</span></div></div>
      <vsc-toolbar class="tb-run" label="Session Actions"><vsc-action icon="play" label="Run" disabled></vsc-action><vsc-action icon="vscode-insiders" label="Open in VS Code - Insiders"></vsc-action></vsc-toolbar>
    </div>
    <div class="grow"></div>
    <vsc-toolbar class="tb-layout" label="Layout">
      <vsc-action icon="layout-panel-off" label="Show Panel (⌘J)"></vsc-action>
      <vsc-action icon="layout-sidebar-right-off" label="Toggle Side Panel (⌥⌘B)"></vsc-action>
      <vsc-action icon="radio-tower" label="Remote Access"></vsc-action>
    </vsc-toolbar>
    <button class="avatar avatar-photo" title="hawkticehurst" aria-label="Accounts: hawkticehurst"><img src="assets/profile.jpg" alt="" /></button>
  </header>
  <div class="body" id="body">
    <aside class="sb" id="sb" aria-label="Inbox">
      <div class="sb-head" id="sb-head"></div>
      <div class="sb-empty" id="sb-empty" hidden></div>
      <div class="sb-list" id="rows" role="list" aria-label="Inbox"></div>
      <div class="sb-bottom" id="bottom"></div>
    </aside>
    <main class="page" id="page">
      <div id="home">
        <h1 class="greet" id="greet">Good afternoon, Hawk</h1>
        <section class="dock" aria-label="New session">
          <vsc-session-view variant="new"><vsc-chat-input id="composer" variant="new-session" placeholder="What should agents work on?" workspace="vscode" isolation="worktree"></vsc-chat-input></vsc-session-view>
        </section>
      </div>
      <section class="session" id="session" aria-label="Session" hidden></section>
    </main>
  </div>
  <vsc-notification-toasts id="toasts" position="bottom-right"></vsc-notification-toasts>
</vsc-workbench>

<script type="module">
const D = window.INBOX_DATA;
const H = D.harnesses;
const WS = Object.fromEntries(D.workspaces.map(w => [w.id, w]));
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const icon = (n, extra = "") => `<vsc-icon name="${n}"${extra}></vsc-icon>`;

const wb = $("#wb");

// view: the session open in the chat view container (null shows the new-session composer).
// mode: what the chat view container renders for it, "summary" (the summarized artifacts) or "chat" (the transcript).
const state = { q: "", finding: false, cur: null, view: null, lastView: null, mode: "summary", sidebar: true, open: { running: false, hold: false, merge: false, done: false },
  sessions: D.sessions.map(s => ({ ...s })), seq: 100, showDone: false };
// The Agents window composer's picker data (harnesses, models, modes, workspaces), from the design system.
const P = window.ds.vscode.chatPickers;
const modelId = (name) => Object.values(P.data.models.catalog).find(m => m.name === name)?.id;
// The new-session workspace picker lists real recent folders; a session started in one the inbox doesn't know yet gets an entry.
function workspaceFor(id) {
  if (!WS[id]) { const o = P.find(P.data.workspaces, id); WS[id] = { id, label: o && !o.noWorkspace ? o.label : "No workspace", repo: o?.description ?? "" }; }
  return id;
}

// Inbox presentation (SESSIONS_LIST.md on the branch): sessions that need you form one flat list by recency; running, on-hold and
// ready-to-merge sessions sit in anchored sections below it. A running deferred session shows in Running until it stops.
const SECTIONS = [
  { id: "running", icon: "session-in-progress", cls: "st-working", one: "session running", many: "sessions running", test: s => s.state === "working" },
  { id: "hold", icon: "clock", one: "session on hold", many: "sessions on hold", test: s => s.onHold && !s.merging && s.state !== "working" && s.state !== "done" },
  { id: "merge", icon: "git-merge", one: "session ready to merge", many: "sessions ready to merge", test: s => !!s.merging && s.state !== "working" && s.state !== "done" },
  { id: "done", icon: "check-all", one: "session done", many: "sessions done", test: s => s.state === "done" },
];
const inInbox = (s) => !s.onHold && !s.merging && (s.state === "input" || s.state === "review" || s.state === "error");

// Filter menu (mirrors the Agents window's Filter Sessions menu: unchecked options are excluded).
// Environments: Local and Worktree both run on This Computer; anything other than Cloud is a remote agent host (e.g. devbox-1).
const environmentOf = (s) => s.env === "Local" || s.env === "Worktree" ? "local" : s.env === "Cloud" ? "cloud" : s.env;
const remoteHosts = [...new Set(D.sessions.map(environmentOf).filter(e => e !== "local" && e !== "cloud"))];
const FILTER_GROUPS = [
  { id: "env", label: "Environment", options: [["local", "This Computer"], ["cloud", "Cloud"], ...remoteHosts.map(h => [h, h])], value: environmentOf },
  { id: "ws", label: "Workspace", options: D.workspaces.map(w => [w.id, w.label]), value: s => s.workspace },
  { id: "harness", label: "Harness", options: Object.entries(H).map(([id, h]) => [id, h.label]), value: s => s.harness },
];
const excluded = Object.fromEntries(FILTER_GROUPS.map(g => [g.id, new Set()]));
const hasFilters = () => FILTER_GROUPS.some(g => excluded[g.id].size);
const passesFilters = (s) => FILTER_GROUPS.every(g => !excluded[g.id].has(g.value(s)));

const matches = (s) => { const q = state.q.toLowerCase(); return passesFilters(s) && (!q || [s.title, s.preview, s.branch, WS[s.workspace].label].join(" ").toLowerCase().includes(q)); };
const inboxList = () => state.sessions.filter(s => inInbox(s) && matches(s));
const visibleSections = () => SECTIONS.filter(x => x.id !== "done" || state.showDone);
const sectionList = (id) => state.sessions.filter(s => SECTIONS.find(x => x.id === id).test(s) && matches(s));
// Rows in on-screen order: the Inbox, then the sessions of each expanded section (what j/k move through).
const visible = () => [...inboxList(), ...visibleSections().flatMap(x => state.open[x.id] ? sectionList(x.id) : [])];

// Mirrors SessionsListModelService.getStatusIcon in microsoft/vscode (src/vs/sessions).
function statusIcon(s) {
  if (s.state === "input") return `<span class="st-input" title="Needs input">${icon("report-question")}</span>`;
  if (s.state === "working") return `<span class="st-working" title="In progress">${icon("session-in-progress")}</span>`;
  if (s.state === "error") return `<span class="st-error" title="Failed">${icon("error")}</span>`;
  if (s.state === "done") return `<span class="st-read" title="Done">${icon("pass-filled")}</span>`;
  return s.unread ? `<span class="st-unread" title="Unread">${icon("circle-filled")}</span>` : `<span class="st-read" title="Read">${icon("circle-small-filled")}</span>`;
}
const diffStat = (s) => ({ a: s.files.reduce((n, f) => n + f[1], 0), d: s.files.reduce((n, f) => n + f[2], 0), n: s.files.length });
// Hover actions per section, named like the branch's Inbox disposition actions.
function rowActions(s) {
  const a = (ic, label, act) => `<vsc-action icon="${ic}" label="${label}" data-act="${act}"></vsc-action>`;
  if (s.state === "done") return a("redo", "Restore", "done") + a("trash", "Delete... (Delete)", "delete");
  if (s.merging) return a("inbox", "Move to Inbox (M)", "merge") + a("check", "Mark as Done (E)", "done");
  if (s.onHold) return a("inbox", "Move to Inbox (H)", "hold") + a("check", "Mark as Done (E)", "done");
  return a("clock", "Move to On Hold (H)", "hold") + (s.state === "review" ? a("git-merge", "Mark as Ready to Merge (M)", "merge") : "") + a("check", "Mark as Done (E)", "done");
}

// Ready to merge: an agent babysits the PR; this simulates it merging a little later, which moves the session to Done.
const MERGE_DELAY_MS = 15000;
function scheduleMerge(s) {
  clearTimeout(s._mergeTimer);
  s._mergeTimer = setTimeout(() => {
    if (!s.merging || s.state === "done") return;
    s.merging = null; s.state = "done"; s.unread = false; s.onHold = false; s.time = "now";
    if (s.pr) s.pr.status = "Merged";
    render(); toast(`${s.pr ? `#${s.pr.num}` : `"${s.title}"`} merged. Moved to Done.`);
  }, MERGE_DELAY_MS);
}

function renderGreeting() {
  const h = new Date().getHours();
  $("#greet").textContent = `Good ${h < 12 ? "morning" : h < 18 ? "afternoon" : "evening"}, ${D.user.name}`;
}

// ---- Sessions sidebar (Inbox presentation) ----
function renderSidebarHead() {
  const head = $("#sb-head");
  if (state.finding) {
    // Inline search replaces the label and actions, like the sessions view's find widget.
    if (head.querySelector("#q")) return;
    head.innerHTML = `<label class="sb-find"><input id="q" placeholder="Search sessions" value="${esc(state.q)}" autocomplete="off" /></label>
      <vsc-toolbar label="Search"><vsc-action icon="close" label="Close (Escape)" data-find-close></vsc-action></vsc-toolbar>`;
    $("#q").addEventListener("input", (e) => { state.q = e.target.value; renderSidebar(); });
    return;
  }
  head.innerHTML = `<span class="sb-label">Inbox</span><vsc-toolbar label="Inbox">
      <vsc-action icon="search" label="Search Sessions (/)" data-find></vsc-action>
      <vsc-action icon="filter" label="Filter Sessions" id="filter-btn" dropdown${hasFilters() || state.showDone ? " checked" : ""}></vsc-action>
      <vsc-action icon="plus" label="New Session (C)" data-new></vsc-action></vsc-toolbar>`;
}
function rowHtml(s) {
  const h = H[s.harness], w = WS[s.workspace], { a, d, n } = diffStat(s);
  const parts = [`<span class="si-ws" title="${esc(w.repo)}">${esc(w.label)}</span>`];
  if (s.merging) parts.push(`<span>${esc(s.merging.status)}</span>`);
  else if (s.state === "working" && s.steps?.length) parts.push(`<span class="st-working">${s.steps.filter(x => x[1] === "done").length + 1}/${s.steps.length}</span>`);
  if (n) parts.push(`<span class="si-diff"><span class="add">+${a}</span><span class="del">−${d}</span></span>`);
  parts.push(`<span>${esc(s.time)}</span>`);
  const sel = state.view === s.id;
  return `<div class="si${sel ? " selected" : ""}${state.cur === s.id ? " cur" : ""}" data-id="${s.id}" role="listitem"${sel ? ` aria-current="true"` : ""}>
    <div class="si-icon">${statusIcon(s)}</div>
    <div class="si-main">
      <div class="si-title-row"><span class="si-title">${md(s.title)}</span><span class="si-actions"><vsc-toolbar label="Session actions">${rowActions(s)}</vsc-toolbar></span></div>
      <div class="si-details"><span title="${h.label}">${icon(h.icon)}</span>${parts.join(`<span class="si-sep"></span>`)}</div>
    </div>
  </div>`;
}
function renderSidebar() {
  renderSidebarHead();
  const list = inboxList(), running = sectionList("running").length, empty = $("#sb-empty");
  empty.hidden = !!list.length;
  empty.textContent = state.q || hasFilters() ? "No sessions match your search or filters." : running ? "Waiting for agents to respond" : "Inbox empty";
  $("#rows").innerHTML = list.map(rowHtml).join("");
  $("#bottom").innerHTML = visibleSections().map(x => {
    const items = sectionList(x.id); if (!items.length) return "";
    const open = state.open[x.id], label = `${items.length} ${items.length === 1 ? x.one : x.many}`;
    return `<div class="bs bs-${x.id}"><div class="bs-head" role="button" tabindex="0" aria-expanded="${open}" data-section="${x.id}">
        <span class="bs-icon ${x.cls || ""}">${icon(x.icon)}</span><span class="bs-label">${label}</span><span class="bs-chev">${icon(open ? "chevron-down" : "chevron-right")}</span></div>
      ${open ? `<div class="bs-list" role="list" aria-label="${label}">${items.map(rowHtml).join("")}</div>` : ""}</div>`;
  }).join("");
}

// ---- Summary: the session's summarized artifacts (V4's preview), as an alternate rendering of the chat view container ----
const checkIcon = (st) => st === "pass" ? `<span class="st-done" title="Passed">${icon("pass")}</span>` : st === "fail" ? `<span class="st-error" title="Failed">${icon("error")}</span>`
  : `<span class="st-working" title="Pending">${icon("loading", " spin")}</span>`;
function summaryHtml(s) {
  const h = H[s.harness], w = WS[s.workspace], sep = `<span class="si-sep"></span>`;
  const env = s.env === "Cloud" ? icon("cloud") + "Cloud" : s.env === "Local" || s.env === "Worktree" ? icon("device-desktop") + s.env : icon("remote") + esc(s.env);
  let out = `<div class="sum-meta"><span>${icon(h.icon)}${h.label}</span>${sep}<span>${esc(s.model)}</span>${sep}<span title="${esc(w.repo)}">${icon("repo")}${esc(w.label)}</span>${sep}`
    + `<span>${icon("git-branch")}<code>${esc(s.branch)}</code></span>${sep}<span>${env}</span>${sep}<span>${esc(s.time)}</span></div>`;
  out += `<div class="sum-task"><b>Task</b>${md(s.prompt)}</div>`;
  for (const r of replies(s)) out += `<div class="sum-task"><b>You replied</b>${esc(r)}</div>`;
  if (s.state === "working") {
    out += `<h3 class="sum-h">Progress</h3><p>${md(s.preview)}</p><div class="steps">${s.steps.map(([l, st]) => `<div class="step ${st}">${st === "done" ? `<span class="st-done">${icon("pass")}</span>` : st === "active" ? `<span class="st-working">${icon("loading", " spin")}</span>` : icon("circle-large-outline")}${md(l)}</div>`).join("")}</div>`;
  } else if (s.body?.length) {
    out += `<h3 class="sum-h">${s.state === "error" ? "What went wrong" : "Summary"}</h3>${s.body.map(p => `<p>${p}</p>`).join("")}`;
  }
  if (pendingChoice(s)) out += visualHtml(s);
  const arts = [];
  if (s.files?.length) {
    const { a, d, n } = diffStat(s);
    arts.push(`<section class="art wide" aria-label="Changes"><div class="art-head">${icon("diff")}<span>Changes</span><span class="muted">${n} file${n > 1 ? "s" : ""}</span><span class="grow"></span>
      <span class="art-num"><span class="add">+${a}</span><span class="del">−${d}</span></span></div>${s.files.map(([p, fa, fd]) => {
        const i = p.lastIndexOf("/");
        return `<div class="art-row">${icon("file")}<span class="art-path">${esc(p.slice(i + 1))}${i > 0 ? ` <span class="dir">${esc(p.slice(0, i))}</span>` : ""}</span><span class="art-num"><span class="add">+${fa}</span><span class="del">−${fd}</span></span></div>`;
      }).join("")}</section>`);
  }
  if (s.checks?.length) {
    const fail = s.checks.filter(c => c[1] === "fail").length, pend = s.checks.filter(c => c[1] === "pending").length;
    arts.push(`<section class="art" aria-label="Checks"><div class="art-head">${icon("checklist")}<span>Checks</span><span class="grow"></span>
      <span class="muted">${fail ? `${fail} failing` : pend ? `${pend} pending` : "All passing"}</span></div>${s.checks.map(([name, st]) =>
        `<div class="art-row">${checkIcon(st)}<span class="art-path">${esc(name)}</span><span class="muted">${st === "pass" ? "Passed" : st === "fail" ? "Failed" : "Pending"}</span></div>`).join("")}</section>`);
  }
  if (s.pr) {
    const merged = s.pr.status === "Merged";
    // A visual session's card already offers Ready to Merge.
    const canMerge = s.state === "review" && !s.merging && !s.onHold && !s.visual;
    arts.push(`<section class="art" aria-label="Pull request"><div class="art-head"><span class="${merged ? "pr-merged" : "pr-open"}">${icon(merged ? "git-merge" : "git-pull-request")}</span><span>Pull request</span><span class="grow"></span><span class="muted">${esc(s.pr.status)}</span></div>
      <div class="art-row"><span class="art-pr"><b>#${s.pr.num}</b> ${esc(s.pr.title)}</span></div>
      ${s.merging ? `<div class="art-row">${icon("git-merge")}<span class="art-pr">Agent Merge: ${esc(s.merging.status)}</span></div>` : ""}
      ${canMerge ? `<div class="art-foot"><vsc-button data-sum-do="merge">Ready to Merge</vsc-button></div>` : ""}</section>`);
  }
  const visual = pendingChoice(s) ? "" : visualHtml(s);
  if (visual || arts.length) out += `<h3 class="sum-h">Artifacts</h3>${visual}${arts.length ? `<div class="arts">${arts.join("")}</div>` : ""}`;
  return out;
}
// Design-system chat question carousel; the first option starts selected, like the product's auto-select on focus.
function carouselHtml(s) {
  return `<vsc-chat-question-carousel question="${esc(s.question.text)}">
      ${s.question.command ? `<div slot="detail"><pre><code>${esc(s.question.command)}</code></pre></div>` : ""}
      ${s.question.options.map((o, i) => `<vsc-chat-question-option label="${esc(o)}"${i ? "" : " selected"}></vsc-chat-question-option>`).join("")}
    </vsc-chat-question-carousel>`;
}
// An open session's composer: the Agents window's session layout with that session's harness, model, mode and permissions.
function composerHtml(s) {
  const attrs = {
    variant: "session", placeholder: `Reply to ${H[s.harness].label}…`, harness: s.harness, model: modelId(s.model),
    environment: s.env === "Cloud" ? "cloud" : "local", mode: s.mode, permissions: s.permissions, approvals: s.approvals, "agent-mode": s.agentMode, "data-session": s.id,
  };
  return `<vsc-session-view><vsc-chat-input ${Object.entries(attrs).filter(([, v]) => v).map(([k, v]) => `${k}="${esc(v)}"`).join(" ")} notice></vsc-chat-input></vsc-session-view>`;
}

// ---- Visual changes: before/after screenshots for sessions whose change is visual ----
// Shots live in assets/shots as {key}-{dark|light}.png and follow the window's theme, or as {key}.png when the UI has its own (themed: false).
const isLight = () => /light/i.test(wb.getAttribute("data-theme") || wb.getAttribute("theme") || "");
const shotSrc = (key) => `assets/shots/${key}-${isLight() ? "light" : "dark"}.png`;
const vcState = (s) => s._vc ||= { mode: s.visual.mode || "split", pick: 0, pos: 50 };
// The card offers the session's decision while one is pending: pick an option (a question with screenshot options) or review a PR.
const vcDecision = (s) => s.state === "input" && s.answerIndex == null && s.visual.after.length > 1 ? "choose" : s.state === "review" && !s.merging && !s.onHold ? "review" : null;
// A question whose options each have a screenshot is answered from the comparison card, so the question card isn't shown too.
const choiceInCard = (s) => !!s.question && s.visual?.after.some(a => a.option != null);
// While that choice is pending, the card sits just above the composer like a question card; once answered it joins the transcript.
const pendingChoice = (s) => s.state === "input" && s.answerIndex == null && choiceInCard(s);
function visualHtml(s, { large = false } = {}) {
  const v = s.visual; if (!v) return "";
  const st = vcState(s), after = v.after[st.pick] || v.after[0], decision = vcDecision(s), multi = v.after.length > 1;
  const img = (key, cls = "", alt = "") => v.themed === false ? `<img class="${cls}" src="assets/shots/${key}.png" alt="${esc(alt)}" draggable="false">`
    : `<img data-shot="${key}" class="${cls}" src="${shotSrc(key)}" alt="${esc(alt)}" draggable="false">`;
  // With several "after" shots, tabs switch between them (the agent's options); otherwise the After label names the branch.
  // Wide cards show tabs in the After label; narrow ones a dropdown in its place (CSS picks one).
  const optTabs = multi ? `<vsc-view-tabs label="Options" active="${st.pick}">${v.after.map((a, i) => `<vsc-view-tab value="${i}">${esc(a.label)}</vsc-view-tab>`).join("")}</vsc-view-tabs>` : "";
  const optSelect = multi ? `<vsc-select label="Option to compare" options="${esc(v.after.map(a => a.label).join(","))}" value="${esc(after.label)}"></vsc-select>` : "";
  const afterLabel = multi ? optTabs + optSelect : `<code>${esc(after.label)}</code>`;
  const before = `<span class="vc-lab"><b>Before</b><code>main</code></span>`, afterCap = `<span class="vc-lab after"><b>After</b>${afterLabel}</span>`;
  const body = st.mode === "swipe"
    ? `<figure class="vc-pane"><figcaption class="vc-swipe-cap">${before}${afterCap}</figcaption>
      <div class="vc-swipe" style="--pos:${st.pos}%" data-vc-swipe="${s.id}">
        ${img(v.before, "", `Before: ${v.caption}`)}${img(after.key, "after", `After: ${v.caption}`)}
        <div class="vc-handle" role="slider" tabindex="0" aria-label="Before and after divider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(st.pos)}"><span class="grip">${icon("arrow-both")}</span></div>
      </div></figure>`
    : `<figure class="vc-pane before"><figcaption>${before}</figcaption><div class="vc-shot">${img(v.before, "", `Before: ${v.caption}`)}</div></figure>
       <figure class="vc-pane after"><figcaption>${afterCap}</figcaption><div class="vc-shot">${img(after.key, "", `After: ${v.caption}`)}</div></figure>`;
  // Request Changes is always offered while you can still reply; the primary action only while its decision is open.
  let foot = "";
  if (s.state !== "done") {

      const w = r.right - r.left, parent = m.dataset.flipFrom ? Number(m.dataset.flipFrom) : null;
      if (parent !== null && parent - w - 2 >= 8) m.setAttribute("x", Math.round(parent - w - 2));
      else {
        m.setAttribute("x", Math.round(Math.max(8, maxX - w)));
        // No room on either side (phones): drop the submenu below its parent menu so the parent stays usable.
        if (m.dataset.below) m.setAttribute("y", m.dataset.below);
      }
    }
  });
  return m;
}
const relRect = (el) => { const r = el.getBoundingClientRect(), w = wb.getBoundingClientRect(); return { left: r.left - w.left, right: r.right - w.left, top: r.top - w.top, bottom: r.bottom - w.top }; };
function focusItem(menu, item) { menu.querySelectorAll("vsc-menu-item").forEach(i => i.classList.toggle("focused", i === item)); }

function openFilterMenu() {
  closeMenus();
  const btn = relRect($("#filter-btn"));
  const root = createMenu(`${FILTER_GROUPS.map(g => `<vsc-menu-item label="${g.label}" submenu data-group="${g.id}"></vsc-menu-item>`).join("")}
    <vsc-menu-separator></vsc-menu-separator>
    <vsc-menu-item label="Show Done" data-show-done${state.showDone ? " checked" : ""}></vsc-menu-item>
    <vsc-menu-separator></vsc-menu-separator>
    <vsc-menu-item label="Reset Filters" data-reset${hasFilters() ? "" : " disabled"}></vsc-menu-item>`, btn.left, btn.bottom + 4);
  menus = [root];
  root.addEventListener("mouseover", (e) => {
    const item = e.target.closest("vsc-menu-item"); if (!item || item.hasAttribute("disabled")) return;
    focusItem(root, item);
    if (item.dataset.group) openSubmenu(item); else closeSubmenu();
  });
  root.addEventListener("click", (e) => {
    if (e.target.closest(".context-view-block")) { closeMenus(); return; }
    const item = e.target.closest("vsc-menu-item"); if (!item || item.hasAttribute("disabled")) return;
    if (item.dataset.group) { openSubmenu(item); return; }
    if (item.hasAttribute("data-show-done")) { setShowDone(!state.showDone); closeMenus(); return; }
    if (item.hasAttribute("data-reset")) { FILTER_GROUPS.forEach(g => excluded[g.id].clear()); closeMenus(); renderSidebar(); }
  });
}
// Show Done adds a Done section below the other anchored sections.
function setShowDone(show) { state.showDone = show; renderSidebar(); }
function closeSubmenu() { if (menus[1]) { menus[1].remove(); menus.length = 1; } }
function openSubmenu(parentItem, force) {
  const group = FILTER_GROUPS.find(g => g.id === parentItem.dataset.group);
  if (!force && menus[1]?.dataset.group === group.id) return;
  closeSubmenu();
  const box = relRect(menus[0].querySelector(".monaco-scrollable-element")), item = relRect(parentItem);
  const sub = createMenu(group.options.map(([id, label]) => `<vsc-menu-item label="${esc(label)}" data-opt="${id}"${excluded[group.id].has(id) ? "" : " checked"}></vsc-menu-item>`).join(""), box.right + 2, item.top - 4);
  sub.dataset.flipFrom = String(Math.round(box.left));
  sub.dataset.below = String(Math.round(box.bottom + 4));
  sub.dataset.group = group.id;
  // Only the root menu's click-catcher should close the menus; the submenu's would cover the root.
  requestAnimationFrame(() => { const block = sub.querySelector(".context-view-block"); if (block) block.style.display = "none"; });
  menus[1] = sub;
  sub.addEventListener("mouseover", (e) => { const i = e.target.closest("vsc-menu-item"); if (i) focusItem(sub, i); });
  sub.addEventListener("click", (e) => {
    const i = e.target.closest("vsc-menu-item"); if (!i) return;
    const set = excluded[group.id], id = i.dataset.opt;
    set.has(id) ? set.delete(id) : set.add(id);
    const resetItem = menus[0].querySelector("[data-reset]");
    hasFilters() ? resetItem.removeAttribute("disabled") : resetItem.setAttribute("disabled", "");
    renderSidebar();
    openSubmenu(parentItem, true);
    focusItem(menus[1], menus[1].querySelector(`[data-opt="${id}"]`));
  });
}
$("#page").addEventListener("scroll", closeMenus, { passive: true });
$("#rows").addEventListener("scroll", closeMenus, { passive: true });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && menus.length) { e.stopImmediatePropagation(); closeMenus(); } }, true);

// ---- Sidebar ----
function openFind() { state.finding = true; renderSidebarHead(); $("#q")?.focus(); }
function closeFind() { state.finding = false; state.q = ""; renderSidebar(); }
function toggleSection(id) {
  state.open[id] = !state.open[id];
  renderSidebar();
  if (lastInput === "key") $(`.bs-head[data-section="${id}"]`)?.focus();
}
function newSession() {
  closeSession();
  if (narrow()) { state.sidebar = false; render(); }
  requestAnimationFrame(() => $("#composer .dt-editor-text")?.focus());
}
$("#sb").addEventListener("click", (e) => {
  if (e.target.closest("#filter-btn")) { menus.length ? closeMenus() : openFilterMenu(); return; }
  if (e.target.closest("[data-find]")) { openFind(); return; }
  if (e.target.closest("[data-find-close]")) { closeFind(); return; }
  if (e.target.closest("[data-new]")) { newSession(); return; }
  const head = e.target.closest(".bs-head");
  if (head) { toggleSection(head.dataset.section); return; }
  const row = e.target.closest(".si"); if (!row) return;
  const s = state.sessions.find(x => x.id === row.dataset.id), a = e.target.closest("[data-act]");
  if (a && s) { e.stopPropagation(); act(s, a.dataset.act); return; }
  openSession(row.dataset.id);
});
$("#sb").addEventListener("keydown", (e) => {
  const head = e.target.closest?.(".bs-head");
  if (head && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.stopPropagation(); toggleSection(head.dataset.section); }
});
$("#sb-toggle").addEventListener("click", () => { state.sidebar = !state.sidebar; render(); });

// ---- Chat view container ----
$("#session").addEventListener("click", (e) => {
  const s = state.sessions.find(x => x.id === state.view);
  if (!s) return;
  if (e.target.closest("#session-more")) { menus.length ? closeMenus() : openSessionMenu(s); return; }
  if (e.target.closest('[data-sum-do="merge"]')) act(s, "merge");
});
$("#session").addEventListener("change", (e) => {
  if (e.target.localName === "vsc-view-tabs" && e.target.classList.contains("s-mode")) setMode(e.detail.value);
});
// Answers from the question carousel go back to the agent like a reply; skipping lets it continue with its defaults.
$("#session").addEventListener("submit", (e) => {
  const s = state.sessions.find(x => x.id === state.view);
  if (s && e.target.localName === "vsc-chat-question-carousel" && e.detail.answer) answer(s, e.detail.answer);
});
$("#session").addEventListener("skip", () => {
  const s = state.sessions.find(x => x.id === state.view);
  if (s) answer(s, "Skipped the question");
});
$("#nav-back").addEventListener("click", closeSession);
$("#nav-fwd").addEventListener("click", () => { if (!state.view && state.lastView) openSession(state.lastView); });

wireComposer($(".dock"), (text) => {
  // The new-session composer's pickers decide the harness, model, workspace, where it runs and its mode.
  const c = $("#composer"), get = (k, d) => c.getAttribute(k) || d;
  const harness = get("harness", "copilot"), model = P.model(get("model", P.defaultModel(harness)), harness);
  const env = get("environment", "local") === "cloud" ? "Cloud" : get("isolation", "branch") === "worktree" ? "Worktree" : "Local";
  const ws = workspaceFor(get("workspace", "vscode"));
  const id = "n" + state.seq++;
  state.sessions.unshift({
    id, state: "working", unread: false, time: "now", day: "Today", title: text.length > 64 ? text.slice(0, 62) + "…" : text,
    harness, model: model.name, workspace: ws, env,
    mode: get("mode"), permissions: get("permissions"), approvals: get("approvals"), agentMode: get("agent-mode"),
    branch: "agents/" + text.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 28).replace(/-$/, ""), prompt: text, preview: "Planning…",
    steps: [["Understand the task and explore the codebase", "active"], ["Make the change", "todo"], ["Run tests and hygiene", "todo"]], files: [],
  });
  // As on the branch: the session starts in the background (under Running) and a fresh composer stays up.
  renderSidebar(); toast("Session started. It'll show up in your Inbox when it needs you.");
});

// Picker choices in a session's composer stick to that session (its composer is rebuilt after each reply).
document.addEventListener("change", (e) => {
  const input = e.target.localName === "vsc-chat-input" ? e.target : null;
  const s = input?.dataset.session && state.sessions.find(x => x.id === input.dataset.session);
  if (!s) return;
  const d = e.detail || {};
  if (d.model) s.model = P.model(d.model, s.harness)?.name ?? s.model;
  if (d.mode) s.mode = d.mode;
  if (d.permissions) s.permissions = d.permissions;
  if (d.approvals) s.approvals = d.approvals;
  if (d["agent-mode"]) s.agentMode = d["agent-mode"];
});

document.addEventListener("keydown", (e) => {
  if (lightbox) return;
  if ((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && e.key.toLowerCase() === "b") { e.preventDefault(); state.sidebar = !state.sidebar; render(); return; }
  if (e.target.id === "q" && e.key === "Escape") { e.preventDefault(); closeFind(); return; }
  if (e.target.closest("input, textarea, [contenteditable], vsc-chat-question-carousel, vsc-action-list, vsc-chat-model-list, .vc, .s-mode") || e.metaKey || e.ctrlKey || e.altKey) { if (e.key === "Escape") e.target.blur?.(); return; }
  // Moving through the sidebar opens each session in the chat view container.
  const list = visible(), i = list.findIndex(x => x.id === (state.cur ?? state.view)), s = list[i] ?? state.sessions.find(x => x.id === state.view);
  const move = (n) => { if (n) openSession(n.id); };
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); move(i < 0 ? list[0] : list[i + 1]); }
  else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); move(list[i - 1]); }
  else if ((e.key === "Enter" || e.key === "o") && s) openSession(s.id);
  else if (e.key === "v" && state.view) setMode(state.mode === "summary" ? "chat" : "summary");
  else if (e.key === "e" && s) act(s, "done");
  else if (e.key === "u" && s && s.state !== "done") act(s, "unread");
  else if ((e.key === "Delete" || e.key === "Backspace") && s && s.state === "done") { e.preventDefault(); act(s, "delete"); }
  else if (e.key === "h" && s && s.state !== "done" && !s.merging) act(s, "hold");
  else if (e.key === "m" && s && (s.merging || s.state === "review")) act(s, "merge");
  else if (e.key === "c") { e.preventDefault(); (state.view ? $("#session .s-composer .dt-editor-text") : $("#composer .dt-editor-text"))?.focus(); }
  else if (e.key === "/") { e.preventDefault(); if (!state.sidebar) { state.sidebar = true; render(); } openFind(); }
  else if (e.key === "Escape" && state.view) { e.preventDefault(); closeSession(); }
});

// Open on the first session that needs you, as if it had just been selected in the sidebar.
state.view = state.cur = inboxList()[0]?.id ?? null;
if (narrow()) state.sidebar = true;
const first = state.sessions.find(x => x.id === state.view);
if (first) first.unread = false;
render();
</script>
</body>
</html>
